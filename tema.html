<!-- ===================== 3.4 MEMORIAS ===================== -->
<h3 id="s-3-4">3.4 Memorias</h3>
<p>Memorias y gamas: la memoria RAM y su evolución (DDR3, DDR4 y DDR5), así como la clasificación de los equipos en gamas baja, media y alta.</p>

<h4 id="s-3-4-1">3.4.1 ¿Qué es la memoria RAM?</h4>
<p>La <strong>RAM (Random Access Memory)</strong> es esencial para que un ordenador almacene y acceda rápidamente a grandes cantidades de datos. Funciona como un búfer, almacenando información temporalmente mientras es procesada por la CPU.</p>
<p>La memoria RAM se mide en gigabytes (GB), comenzando desde 4 GB hasta 32 GB o más, y ha avanzado en los últimos años debido a la demanda de los consumidores. La velocidad de la RAM es crucial, especialmente para la multitarea y los juegos, que requieren más RAM y acceso más rápido.</p>
<p>La RAM también permite una puesta en marcha más rápida de las aplicaciones, reduciendo los tiempos de carga. Invertir en capacidad y velocidad de RAM ayuda a que las computadoras portátiles funcionen sin problemas ni demoras.</p>
<div class="fig-par">
<figure class="fig fig-chica"><img src="imagenes/u3m_ram_chips.png" alt="Chips de memoria RAM sobre un módulo"><figcaption>Chips de un módulo de memoria RAM.</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3m_ram_azul.png" alt="Módulo de memoria RAM con circuitos verdes sobre fondo azul"><figcaption>Módulo de memoria RAM.</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3m_ram_arquitectura.png" alt="Arquitectura de memoria RAM: módulo con chips y circuitos"><figcaption>Arquitectura de memoria RAM (ihardware.info).</figcaption></figure>
</div>

<h4 id="s-3-4-2">3.4.2 ¿Cómo funcionan?</h4>
<p>Su función principal es guardar de forma temporal los datos de los programas y aplicaciones que estás usando en el momento para que el procesador (CPU) pueda acceder a ellos de manera casi instantánea.</p>
<ul>
    <li><strong>Lectura y escritura rápida:</strong> a diferencia del disco duro o SSD (que guardan la información a largo plazo aunque apagues el equipo), la RAM es volátil: cuando apagas o reinicias el dispositivo, todo lo que está en la RAM se borra.</li>
    <li><strong>Intermediario con el procesador:</strong> cuando abres un juego o un navegador, el sistema operativo carga los archivos necesarios desde el almacenamiento principal (lento) hacia la RAM (extremadamente rápida). El procesador lee y escribe directamente en la RAM para ejecutar tus acciones sin retrasos.</li>
    <li><strong>Acceso aleatorio:</strong> significa que el procesador puede acceder a cualquier parte de la memoria de forma directa en el mismo tiempo, sin tener que leer los datos en un orden secuencial (como pasaba en las cintas antiguas).</li>
    <li><strong>Estructura física interna:</strong> a nivel microscópico, la RAM está compuesta por millones (o miles de millones) de diminutos condensadores y transistores organizados en una matriz de filas y columnas. Cada intersección en esta cuadrícula forma una celda de memoria que almacena un bit de datos (un 0 o un 1), dependiendo de si el condensador está cargado o descargado eléctricamente.</li>
</ul>
<figure class="fig"><img src="imagenes/u3m_como_funciona.png" alt="Infografía de cómo funciona la memoria RAM: lectura y escritura rápida, intermediario con el procesador, acceso aleatorio y estructura física interna"><figcaption>Cómo funciona la memoria RAM: 1) lectura y escritura rápida, 2) intermediario con el procesador, 3) acceso aleatorio, 4) estructura física interna (matriz de celdas con condensador y transistor).</figcaption></figure>

<h4 id="s-3-4-3">3.4.3 Características</h4>
<p>Existen diferentes tipos de memoria RAM, como la <strong>DRAM</strong>, que es la más común, y la <strong>SRAM</strong>, que es más rápida pero también más costosa. Actualmente, las versiones más utilizadas son DDR3, DDR4 y DDR5.</p>
<p>Entre sus características principales se encuentran la <strong>capacidad</strong>, medida en gigabytes (GB), la <strong>velocidad</strong>, medida en megahertz (MHz), y la <strong>latencia</strong>, que indica el tiempo de respuesta. Estos factores influyen directamente en el rendimiento del equipo.</p>

<h4 id="s-3-4-4">3.4.4 Tipos de memorias</h4>
<h5>Tipos principales</h5>
<ul>
    <li><strong>DDR (DDR3, DDR4, DDR5):</strong> las más usadas actualmente.</li>
    <li><strong>SRAM:</strong> más rápida, pero costosa (usada en caché).</li>
    <li><strong>DRAM:</strong> más común y económica.</li>
    <li><strong>Capacidades (GB):</strong> 4 GB, 8 GB, 16 GB, etc.</li>
    <li><strong>Velocidad (MHz):</strong> influye en el rendimiento.</li>
</ul>
<figure class="fig fig-chica"><img src="imagenes/u3m_tipos.png" alt="Ilustración de DDR5, SRAM (caché), DRAM, capacidades en GB y velocidad en MHz"><figcaption>Tipos de memorias: DDR5, SRAM (caché), DRAM, capacidades (4, 8 y 16 GB) y velocidad (MHz).</figcaption></figure>

<h4 id="s-3-4-5">3.4.5 Memoria DDR3</h4>
<h5>¿Qué es?</h5>
<p>La memoria DDR3, cuyo nombre completo es <strong>Double Data Rate type 3 Synchronous Dynamic Random-Access Memory</strong>, es un tipo de memoria RAM. Como toda RAM, es volátil, lo que significa que pierde la información al apagarse el equipo. Su principal característica es que transmite datos dos veces por ciclo de reloj, lo que le permite alcanzar velocidades superiores a las generaciones anteriores.</p>
<h5>Características</h5>
<p>DDR3 se distingue por varias mejoras técnicas:</p>
<ul>
    <li>Funciona con un voltaje reducido, entre 1.5 y 1.65 voltios, lo que implica menor consumo energético.</li>
    <li>Sus frecuencias de operación van desde 1066 MHz hasta 2133 MHz.</li>
    <li>Los módulos pueden tener capacidades desde 1 GB hasta 16 GB.</li>
    <li>Posee 240 pines, con una muesca distinta a DDR2, lo que evita confusiones al instalarla.</li>
</ul>
<div class="fig-par">
<figure class="fig fig-chica"><img src="imagenes/u3m_ddr3_4gb.png" alt="Módulo DDR3 de 4 GB, 1600 MHz CL11"><figcaption>Módulo DDR3 de 4 GB (1600 MHz, CL11).</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3m_ddr3_8gb.png" alt="Módulo DDR3 de 8 GB, 1333 MHz CL9"><figcaption>Módulo DDR3 de 8 GB (1333 MHz, CL9).</figcaption></figure>
</div>
<h5>Ventajas frente a DDR2</h5>
<p>Comparada con DDR2, DDR3 ofrece mayor ancho de banda, menor consumo eléctrico y mayor capacidad por módulo. Además, introdujo perfiles XMP que facilitan configuraciones de rendimiento para usuarios avanzados.</p>
<h5>Limitaciones y transición a DDR4</h5>
<p>Con el tiempo, DDR3 fue superada por DDR4, que ofrece velocidades más altas, menor consumo energético y mayor capacidad máxima. A partir de 2014, DDR4 comenzó a reemplazar a DDR3 en la mayoría de los equipos nuevos.</p>
<h5>Aplicaciones y relevancia histórica</h5>
<p>Durante casi una década, DDR3 fue el estándar en PCs, laptops y servidores. Gracias a ella, se pudieron ejecutar programas más exigentes en gráficos, multitarea y virtualización. Aunque hoy ya no se fabrica masivamente, sigue presente en equipos antiguos.</p>


<h4 id="s-3-4-6">3.4.6 Memoria DDR4</h4>
<h5>¿Qué es?</h5>
<p>La memoria DDR4 (Double Data Rate 4) es un tipo de memoria RAM muy popular utilizada en computadoras y laptops. Es la cuarta generación de esta tecnología y se encarga de almacenar temporalmente los datos que el procesador necesita usar al momento.</p>
<h5>Características</h5>
<ul>
    <li><strong>Velocidades:</strong> operan típicamente entre 2133 MHz y 3200 MHz, aunque los módulos de alto rendimiento pueden superar los 4000 MHz.</li>
    <li><strong>Capacidad:</strong> los módulos individuales para consumidores suelen llegar hasta los 32 GB o 64 GB, permitiendo configuraciones de sistema de gran volumen.</li>
    <li><strong>Formato físico:</strong> utilizan un conector de 288 pines para computadoras de escritorio (DIMM) y 260 pines para laptops (SODIMM).</li>
    <li><strong>Eficiencia:</strong> funcionan a un voltaje estándar de 1.2 V, lo que reduce el consumo de energía hasta en un 40 % respecto a la generación anterior.</li>
</ul>
<figure class="fig fig-chica"><img src="imagenes/u3m_ddr4_8gb.png" alt="Módulo DDR4 de 8 GB a 3200 MHz para portátil"><figcaption>Memoria DDR4 de 8 GB a 3200 MHz para portátil.</figcaption></figure>

<h4 id="s-3-4-7">3.4.7 Memoria DDR5</h4>
<h5>¿Qué es?</h5>
<p>La memoria DDR5 (Double Data Rate 5) es la quinta y más avanzada generación de memoria RAM para computadoras, diseñada para ofrecer casi el doble de ancho de banda y velocidad que su antecesora (DDR4) mediante frecuencias que superan los 8000 MHz, una arquitectura interna de doble canal por módulo, tecnología de corrección de errores integrada (On-Die ECC) y un chip de gestión de energía propio (PMIC) que optimiza el consumo a solo 1.1 V para lograr una mayor estabilidad en tareas de alto rendimiento.</p>
<h5>Características</h5>
<ul>
    <li><strong>Velocidad y rendimiento:</strong> la velocidad base comienza en 4800 MT/s, superando los máximos comunes de DDR4 (3200–3600 MHz).</li>
    <li><strong>Mayor capacidad:</strong> los módulos individuales pueden alcanzar 64 GB o 128 GB, ideales para estaciones de trabajo de alto rendimiento.</li>
    <li><strong>Eficiencia energética:</strong> funciona a un voltaje estándar de 1.1 V (frente a 1.2 V o 1.35 V de DDR4), lo que resulta en un menor consumo de energía por bit transmitido.</li>
    <li><strong>Arquitectura de canales:</strong> DDR5 utiliza dos canales de 32 bits independientes por módulo para mejorar la eficiencia en la transferencia de datos.</li>
    <li><strong>Gestión de energía (PMIC):</strong> incorpora el circuito integrado de gestión de energía (PMIC) directamente en el módulo, mejorando la integridad de la señal y la estabilidad.</li>
</ul>
<figure class="fig"><img src="imagenes/u3m_ddr5_estructura.png" alt="Estructura de un módulo DDR5 con PMIC, SPD Hub y DRAM, comparada con DDR4 y DDR3"><figcaption>Estructura del módulo DDR5 (PMIC, SPD Hub, inductores, capacitores, resistencias, PCB y DRAM) comparada con DDR4 y DDR3.</figcaption></figure>

<h4 id="s-3-4-8">3.4.8 Ejemplos</h4>
<h5>Corsair Vengeance (y Vengeance Pro)</h5>
<p>Sus disipadores de aluminio son ideales para mantener la estabilidad si el procesador está bajo mucha carga. La versión «Pro» permitía un overclocking muy estable a 2133 MHz o más.</p>
<figure class="fig fig-chica"><img src="imagenes/u3m_corsair_vengeance.png" alt="Módulos Corsair Vengeance Pro RGB instalados en una placa base"><figcaption>Corsair Vengeance Pro.</figcaption></figure>
<h5>G.Skill Ripjaws X</h5>
<p>Fiabilidad en plataformas tanto de Intel como de AMD (serie FX). Ofrece latencias muy bajas (CL9 en modelos de 1600 MHz), lo que compensa la baja frecuencia frente a estándares modernos.</p>
<figure class="fig fig-chica"><img src="imagenes/u3m_gskill_ripjaws.png" alt="Módulos G.Skill Ripjaws X azules"><figcaption>G.Skill Ripjaws X.</figcaption></figure>

<!-- ===================== 3.5 GAMAS ===================== -->
<h3 id="s-3-5">3.5 Gamas</h3>
<h4 id="s-3-5-1">3.5.1 ¿Qué es una gama?</h4>
<p>Una gama es el nivel o jerarquía con el que se clasifican los dispositivos en categorías (alta, media y baja) según su rendimiento, materiales de construcción y precio, teniendo en el procesador y las cámaras sus mayores elementos diferenciadores.</p>
<div class="info-grid">
    <div class="info-card"><h5>Gama alta</h5><p>Reúne lo último en tecnología, incorporando máxima potencia, pantallas AMOLED de alta calidad e inteligencia artificial avanzada.</p></div>
    <div class="info-card"><h5>Gama media</h5><p>Se posiciona como el punto de equilibrio ideal al ofrecer un rendimiento sólido a un precio accesible.</p></div>
    <div class="info-card"><h5>Gama baja</h5><p>Prioriza la asequibilidad con características funcionales diseñadas para cubrir tareas cotidianas y básicas.</p></div>
</div>
<figure class="fig fig-chica"><img src="imagenes/u3m_gama.png" alt="Ilustración de la nube conectada a un teléfono móvil, una portátil y un ordenador de sobremesa"><figcaption>Gamas: teléfono móvil, portátil y ordenador de sobremesa conectados a la nube.</figcaption></figure>

<h4 id="s-3-5-2">3.5.2 Gama baja</h4>
<h5>¿Qué es?</h5>
<p>Una PC de gama baja es un equipo económico diseñado para tareas básicas como navegar por internet, usar programas de oficina y reproducir contenido multimedia, con componentes de menor potencia y capacidad que los de gamas media o alta. Su principal ventaja es el precio accesible, aunque su rendimiento es limitado para aplicaciones exigentes como videojuegos modernos o software de diseño.</p>
<h5>Características</h5>
<ul>
    <li><strong>Procesador:</strong> modelos básicos como Intel Core i3, Pentium, o AMD Ryzen 3, que ofrecen suficiente potencia para tareas simples.</li>
    <li><strong>Memoria RAM:</strong> generalmente 4 GB a 8 GB, lo que permite multitarea ligera pero con limitaciones si se abren muchos programas a la vez.</li>
    <li><strong>Almacenamiento:</strong> suelen incluir discos duros tradicionales (HDD) de 500 GB a 1 TB, aunque algunos modelos más recientes integran SSD pequeños (128–256 GB) para mejorar la velocidad.</li>
    <li><strong>Tarjeta gráfica:</strong> normalmente integrada en el procesador, adecuada para video en HD y juegos muy ligeros, pero insuficiente para gráficos avanzados.</li>
    <li><strong>Precio:</strong> son las opciones más económicas del mercado, pensadas para estudiantes, oficinas pequeñas o usuarios con necesidades básicas.</li>
</ul>
<div class="fig-par">
<figure class="fig fig-chica"><img src="imagenes/u3m_baja_collage.png" alt="Computadoras antiguas de gama baja"><figcaption>Equipos de gama baja.</figcaption></figure>

</div>

<h4 id="s-3-5-3">3.5.3 Gama media</h4>
<h5>¿Qué es?</h5>
<p>La gama media se caracteriza por ofrecer un equilibrio entre rendimiento, precio y funcionalidad. Este tipo de equipos está diseñado para usuarios que necesitan más que tareas básicas, pero que no requieren la máxima potencia de una computadora de gama alta. En cuanto al rendimiento, las PCs de gama media suelen contar con procesadores de buena capacidad, como los de Intel (Core i5) o AMD (Ryzen 5). Estos permiten realizar múltiples tareas al mismo tiempo, como trabajar con documentos, navegar en internet, programar, editar contenido ligero e incluso jugar algunos videojuegos sin problemas.</p>
<h5>Características</h5>
<ul>
    <li>En memoria y almacenamiento, normalmente incluyen entre 8 y 16 GB de RAM, lo que garantiza un funcionamiento fluido.</li>
    <li>Suelen incorporar discos SSD, que hacen que el sistema operativo y los programas carguen más rápido en comparación con los discos duros tradicionales.</li>
    <li>Incluyen tarjetas gráficas dedicadas, como las de NVIDIA o AMD, lo que permite ejecutar juegos o programas de diseño a un nivel intermedio.</li>
    <li>Las computadoras de gama media son ideales para estudiantes, oficinistas y usuarios en general, ya que ofrecen un buen desempeño en la mayoría de las tareas diarias sin tener un costo tan elevado como los equipos de gama alta.</li>
</ul>
<div class="fig-par">
<figure class="fig fig-chica"><img src="imagenes/u3m_media_pc_roja.png" alt="Computadora gamer con monitor y gabinete con ventiladores rojos"><figcaption>Equipo de gama media con gabinete gamer.</figcaption></figure>

<h4 id="s-3-5-4">3.5.4 Gama alta</h4>
<h5>¿Qué es?</h5>
<p>La gama alta se refiere a los dispositivos electrónicos como celulares, laptops o tablets. La gama alta ofrece lo mejor en tecnología, materiales y rendimiento. Son los modelos premium de cada marca, diseñados para usuarios que buscan potencia, durabilidad y funciones avanzadas.</p>
<h5>Características</h5>
<ul>
    <li><strong>Rendimiento:</strong> procesadores más potentes (Snapdragon, Apple A-series) y gran memoria RAM, asegurando rapidez y eficiencia.</li>
    <li><strong>Cámaras:</strong> sistemas multicámara de alta resolución, enfoque en fotografía nocturna y grabación de video avanzada.</li>
    <li><strong>Pantalla:</strong> paneles con alta resolución, altas tasas de refresco (120 Hz o más) y gran brillo (hasta 3500 nits).</li>
    <li><strong>Construcción:</strong> materiales premium (cristal, titanio) y resistencia al agua/polvo, usualmente certificación IP68.</li>
    <li><strong>Batería y carga:</strong> capacidad alta (sobre 5000 mAh) con carga rápida por cable (más de 100 W) e inalámbrica.</li>
</ul>

                contenido: `
<h2 id="s-4-0">Procesamiento paralelo</h2>
<p>En esta unidad se estudia cómo muchos procesadores trabajan juntos para resolver un mismo problema: cómo se clasifican las máquinas paralelas, cómo se organiza su memoria, qué redes de interconexión las unen y qué supercomputadoras y sistemas reales las aplican.</p>
<h3 id="s-4-1">4.1 Aspectos básicos de la computación paralela</h3>
<h5>Motivación: un solo núcleo ya no alcanza</h5>
<div class="info-grid"><div class="info-card"><h5>El muro de la potencia</h5><p>Hasta ~2005 los procesadores ganaban velocidad subiendo la frecuencia de reloj. La potencia dinámica crece como <span class="flujo">P ≈ C · V² · f</span>: más GHz = más calor. Los chips llegaron al límite térmico y la industria cambió de estrategia: <strong>más núcleos</strong> en lugar de núcleos más rápidos.</p></div><div class="info-card"><h5>La ley de Moore sigue (más o menos)</h5><p>El número de transistores se ha duplicado aproximadamente cada 2 años. Esos transistores extra se usan para más núcleos, cachés y aceleradores. Hoy un teléfono tiene 8 núcleos y una GPU con cientos de unidades, por lo que el <strong>software debe ser paralelo</strong> para aprovechar el hardware.</p></div></div>
<h5>¿Qué es la computación paralela?</h5>
<p>Es el uso <strong>simultáneo</strong> de múltiples recursos de cómputo para resolver un problema: el problema se divide en partes que se ejecutan <strong>al mismo tiempo</strong> en distintos procesadores, coordinadas por un mecanismo de control.</p>
<p><span class="flujo">Problema grande</span> → <span class="flujo">Se divide en tareas</span> → <span class="flujo">Cada tarea en un procesador</span> → <span class="flujo">Se combinan resultados</span></p>
<p class="nota">Ejemplo cotidiano: 4 personas calificando 200 exámenes terminan casi 4 veces más rápido que una sola… si se reparten bien el trabajo.</p>
<h5>Conceptos clave</h5>
<div class="info-grid"><div class="info-card"><h5>Tarea</h5><p>Unidad lógica de trabajo que puede ejecutarse en un procesador.</p></div><div class="info-card"><h5>Granularidad</h5><p>Relación cómputo/comunicación. <strong>Fina</strong>: muchas tareas pequeñas. <strong>Gruesa</strong>: pocas tareas grandes.</p></div><div class="info-card"><h5>Comunicación</h5><p>Intercambio de datos entre tareas: por memoria compartida o por mensajes.</p></div><div class="info-card"><h5>Sincronización</h5><p>Coordinar el orden de las tareas: candados (locks), semáforos, barreras.</p></div><div class="info-card"><h5>Balanceo de carga</h5><p>Repartir el trabajo para que ningún procesador quede ocioso.</p></div><div class="info-card"><h5>Escalabilidad</h5><p>Capacidad de mejorar el rendimiento al agregar más procesadores.</p></div></div>
<h5>Concurrencia vs. paralelismo</h5>
<div class="info-grid"><div class="info-card"><h5>Concurrencia</h5><p>Varias tareas avanzan <strong>intercalándose</strong> en el tiempo en un solo núcleo. Parecen simultáneas, pero no lo son.</p><div class="linea-t"><span>1 núcleo</span><div class="pista"><i class="a" style="left:0;width:16%"></i><i class="b" style="left:16%;width:16%"></i><i class="a" style="left:32%;width:16%"></i><i class="b" style="left:48%;width:16%"></i><i class="a" style="left:64%;width:16%"></i><i class="b" style="left:80%;width:16%"></i></div></div></div><div class="info-card"><h5>Paralelismo</h5><p>Varias tareas se ejecutan <strong>literalmente al mismo tiempo</strong> en recursos distintos. Terminan en menos de la mitad del tiempo.</p><div class="linea-t"><span>Núcleo 1</span><div class="pista"><i class="a" style="left:0;width:48%"></i></div></div><div class="linea-t"><span>Núcleo 2</span><div class="pista"><i class="b" style="left:0;width:48%"></i></div></div></div></div>
<h5>Medidas de rendimiento</h5>
<div class="info-grid"><div class="info-card"><h5>Aceleración (Speedup)</h5><div class="formula">S(p) = T₁ / Tₚ</div><p>T₁: tiempo con 1 procesador. Tₚ: tiempo con p procesadores.</p></div><div class="info-card"><h5>Eficiencia</h5><div class="formula">E(p) = S(p) / p</div><p>Qué tan bien se aprovecha cada procesador. Ideal = 1 (100 %).</p></div><div class="info-card"><h5>Costo</h5><div class="formula">C = p · Tₚ</div><p>Trabajo total invertido. Óptimo si es igual a T₁.</p></div></div>
<p class="nota">Ejemplo: un programa tarda 120 s en 1 núcleo y 20 s en 8 núcleos → S = 6, E = 0.75 (75 %).</p>
<h5>Ley de Amdahl (Gene Amdahl, 1967)</h5>
<div class="formula">S(p) = 1 / [ (1 − f) + f / p ]</div>
<ul><li><strong>f</strong> = fracción del programa que se puede paralelizar.</li><li><strong>1 − f</strong> = parte secuencial que nadie puede acelerar.</li><li>Aunque p → ∞, la aceleración máxima es <strong>1 / (1 − f)</strong>.</li><li>Con f = 95 %, el máximo teórico es <strong>20×</strong>, aunque tengas 1 millón de núcleos.</li></ul>

<p class="nota">Pregunta: «¿Cuántos núcleos necesito para acelerar 10× un programa que es 90 % paralelo?» Respuesta: ninguno basta, el límite es 10×.</p>
<h5>Ley de Gustafson (John Gustafson, 1988)</h5>
<div class="formula">S(p) = p − α · (p − 1)</div>
<ul><li>α = fracción secuencial.</li><li>Amdahl fija el tamaño del problema; Gustafson lo hace <strong>crecer</strong> con p: con más procesadores resolvemos problemas más grandes en el mismo tiempo.</li><li>Ejemplo: en una simulación del clima, con 10× más nodos no se busca terminar 10× antes, sino usar una malla 10× más fina en el mismo tiempo.</li><li>Con α = 5 % y p = 100 → S ≈ 95. Es mucho más optimista que Amdahl y explica por qué existen supercomputadoras con millones de núcleos.</li></ul>
<h5>Niveles de paralelismo</h5>
<div class="info-grid"><div class="info-card"><h5>Bit</h5><p>Aumentar el tamaño de palabra: 8 → 16 → 32 → 64 bits. Se procesan más bits por instrucción.</p></div><div class="info-card"><h5>Instrucción (ILP)</h5><p>Varias instrucciones a la vez dentro del núcleo: pipeline, superescalar, ejecución fuera de orden.</p></div><div class="info-card"><h5>Datos</h5><p>La misma operación sobre muchos datos: vectores, SIMD, GPU.</p></div><div class="info-card"><h5>Tareas / hilos</h5><p>Distintas tareas en distintos núcleos o computadoras: multihilo, clústeres.</p></div></div>
<div class="pros-cons"><div class="pro"><h6>Ventajas</h6><ul><li>Menor tiempo de respuesta.</li><li>Resolver problemas imposibles para una sola máquina (clima, genómica, IA).</li><li>Mejor relación costo/rendimiento con hardware común.</li><li>Tolerancia a fallos mediante redundancia.</li></ul></div><div class="contra"><h6>Retos</h6><ul><li>Programar es más difícil: condiciones de carrera e interbloqueos (deadlock).</li><li>La comunicación entre procesadores cuesta tiempo.</li><li>Balancear la carga no es trivial y depurar es complejo (errores no deterministas).</li><li>La parte secuencial limita la aceleración (Amdahl).</li></ul></div></div>
<h3 id="s-4-2">4.2 Tipos de computación paralela</h3>
<div class="info-grid"><div class="info-card"><h5>Multinúcleo</h5><p>Varios núcleos en un mismo chip que comparten memoria. Tu laptop y tu teléfono.</p></div><div class="info-card"><h5>Multiprocesador simétrico (SMP)</h5><p>Varios procesadores iguales con una memoria común y un solo sistema operativo.</p></div><div class="info-card"><h5>Clúster</h5><p>Computadoras completas unidas por una red rápida que trabajan como un solo sistema.</p></div><div class="info-card"><h5>MPP</h5><p>Procesamiento masivamente paralelo: miles de nodos con red propietaria muy rápida. Supercomputadoras.</p></div><div class="info-card"><h5>Grid y nube</h5><p>Recursos distribuidos en distintos lugares, coordinados por software (BOINC, AWS).</p></div><div class="info-card"><h5>Aceleradores</h5><p>GPU, TPU, FPGA: hardware especializado para paralelismo de datos.</p></div></div>
<h4 id="s-4-2-1">4.2.1 Clasificación</h4>
<h5>Taxonomía de Flynn (Michael Flynn, 1966)</h5>
<p>Clasifica las arquitecturas según el número de <strong>flujos de instrucciones</strong> y de <strong>flujos de datos</strong>.</p>

<div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Clase</th><th>Descripción</th><th>Ejemplos</th></tr></thead><tbody><tr><td>SISD</td><td>Un procesador ejecuta un flujo de instrucciones sobre un flujo de datos (von Neumann tradicional; puede tener pipeline interno).</td><td>PC de un solo núcleo, Intel 8086, microcontroladores</td></tr><tr><td>SIMD</td><td>Una unidad de control envía la <strong>misma instrucción</strong> a muchas unidades de procesamiento; cada una opera un dato distinto.</td><td>Cray-1, SSE/AVX/NEON, GPU (SIMT)</td></tr><tr><td>MISD</td><td>Varios procesadores aplican instrucciones distintas al mismo dato. Casi no existe comercialmente.</td><td>Sistemas redundantes tolerantes a fallos, arreglos sistólicos</td></tr><tr><td>MIMD</td><td>Cada procesador ejecuta su propio programa sobre sus propios datos. Es la categoría más común hoy.</td><td>Multinúcleos y clústeres</td></tr></tbody></table></div>
<div class="codigo"><span class="k">// una instrucción AVX suma 8 floats a la vez</span><br>C[0..7] = A[0..7] + B[0..7]</div>
<h5>Clasificación extendida de MIMD</h5>
<ul><li><strong>Multiprocesadores</strong> (memoria compartida): UMA, NUMA, COMA.</li><li><strong>Multicomputadores</strong> (memoria distribuida): MPP y clústeres (COW).</li><li>Clasificación de Johnson (1988): combina memoria global/distribuida con variables compartidas/paso de mensajes → GMSV, GMMP, DMSV, DMMP.</li></ul>
<h5>Modelos de programación: SPMD vs. MPMD</h5>
<div class="info-grid"><div class="info-card"><h5>SPMD · Single Program, Multiple Data</h5><ul><li>Todos los procesos ejecutan el <strong>mismo programa</strong>.</li><li>Cada uno trabaja con su porción de datos según su identificador (rank).</li><li>Es el modelo más usado con MPI y OpenMP.</li></ul></div><div class="info-card"><h5>MPMD · Multiple Program, Multiple Data</h5><ul><li>Cada proceso puede ejecutar un programa distinto.</li><li>Ejemplo: un maestro reparte trabajo y varios trabajadores lo procesan.</li><li>Común en flujos productor-consumidor o pipelines de datos.</li></ul></div></div>
<h4 id="s-4-2-2">4.2.2 Arquitectura de computadoras secuenciales</h4>
<h5>El modelo de von Neumann (1945)</h5>
<figure class="fig-svg"><svg class="dg" viewBox="0 0 920 380" role="img" aria-label="Modelo de von Neumann"><rect x="30" y="30" width="400" height="320" rx="18" class="bx soft"/><text x="230" y="66" class="tl" font-size="26" text-anchor="middle">CPU</text><rect x="60" y="90" width="160" height="110" rx="10" class="bx hi"/><text x="140.0" y="143.0" class="tl" font-size="20" text-anchor="middle">Unidad de</text><text x="140.0" y="165.0" class="ts" font-size="16" text-anchor="middle">Control (UC)</text><rect x="240" y="90" width="160" height="110" rx="10" class="bx hi"/><text x="320.0" y="143.0" class="tl" font-size="22" text-anchor="middle">ALU</text><text x="320.0" y="167.0" class="ts" font-size="18" text-anchor="middle">aritmética y lógica</text><rect x="60" y="220" width="340" height="100" rx="10" class="bx"/><text x="230.0" y="268.0" class="tl" font-size="20" text-anchor="middle">Registros</text><text x="230.0" y="290.0" class="ts" font-size="16" text-anchor="middle">PC · IR · MAR · MDR · ACC</text><line x1="430" y1="190" x2="500" y2="190" class="bus"/><line x1="500" y1="60" x2="500" y2="320" class="bus"/><line x1="500" y1="110" x2="570" y2="110" class="bus"/><line x1="500" y1="270" x2="570" y2="270" class="bus"/><rect x="570" y="40" width="320" height="140" rx="10" class="bx hi"/><text x="730.0" y="108.0" class="tl" font-size="22" text-anchor="middle">Memoria principal</text><text x="730.0" y="132.0" class="ts" font-size="18" text-anchor="middle">instrucciones + datos</text><rect x="570" y="210" width="320" height="120" rx="10" class="bx"/><text x="730.0" y="268.0" class="tl" font-size="22" text-anchor="middle">Entrada / Salida</text><text x="730.0" y="292.0" class="ts" font-size="18" text-anchor="middle">teclado · disco · red</text><text x="500" y="365" class="ts" font-size="16" text-anchor="middle">Bus del sistema (direcciones · datos · control)</text><circle r="7" class="pk"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M 570 110 L 500 110 L 500 190 L 430 190"/></circle><circle r="7" class="pk alt"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 430 190 L 500 190 L 500 110 L 570 110"/></circle><circle r="6" class="pk"><animateMotion dur="3.4s" begin="0.5s" repeatCount="indefinite" path="M 570 270 L 500 270 L 500 190 L 430 190"/></circle></svg><figcaption>Modelo de von Neumann: programa y datos viajan por el mismo bus.</figcaption></figure>
<p class="nota">Programa y datos viven en la misma memoria y viajan por el mismo bus. Una instrucción a la vez.</p>
<h5>El ciclo de instrucción</h5>
<figure class="fig-svg"><svg class="dg" viewBox="0 0 720 470" role="img" aria-label="Ciclo de instrucción"><circle cx="360" cy="240" r="150" class="orbit"/><g><circle cx="360" cy="90" r="13" class="pk"/><animateTransform attributeName="transform" type="rotate" from="0 360 240" to="360 360 240" dur="6s" repeatCount="indefinite"/></g><text x="20" y="30" class="lab c1" font-size="18" text-anchor="start">Ciclo de instrucción</text><circle cx="360" cy="90" r="9" class="dot"/><text x="360" y="50" class="tl" font-size="22" text-anchor="middle">1 · Búsqueda</text><text x="360" y="74" class="ts" font-size="16" text-anchor="middle">fetch: PC → MAR, lee IR</text><circle cx="510" cy="240" r="9" class="dot"/><text x="535" y="238" class="tl" font-size="22" text-anchor="start">2 · Decodificación</text><text x="535" y="262" class="ts" font-size="16" text-anchor="start">UC interpreta opcode</text><circle cx="360" cy="390" r="9" class="dot"/><text x="360" y="430" class="tl" font-size="22" text-anchor="middle">3 · Ejecución</text><text x="360" y="454" class="ts" font-size="16" text-anchor="middle">ALU opera</text><circle cx="210" cy="240" r="9" class="dot"/><text x="185" y="238" class="tl" font-size="22" text-anchor="end">4 · Escritura</text><text x="185" y="262" class="ts" font-size="16" text-anchor="end">guarda resultado, PC+1</text></svg><figcaption>Ciclo de instrucción: búsqueda, decodificación, ejecución y escritura.</figcaption></figure>
<ul><li><strong>Búsqueda:</strong> el PC indica la dirección; la instrucción se copia al registro IR.</li><li><strong>Decodificación:</strong> la UC identifica la operación y los operandos.</li><li><strong>Ejecución:</strong> la ALU realiza el cálculo o se accede a memoria.</li><li><strong>Escritura:</strong> se guarda el resultado y el PC avanza a la siguiente instrucción.</li></ul>
<h5>El cuello de botella de von Neumann</h5>
<ul><li>El procesador es mucho más rápido que la memoria y todo (instrucciones y datos) pasa por un único bus.</li><li>La CPU pasa gran parte del tiempo <strong>esperando datos</strong>. Término popularizado por John Backus en 1977.</li></ul>
<div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th></th><th>Von Neumann</th><th>Harvard</th></tr></thead><tbody><tr><td>Memoria</td><td>Única</td><td>Separada (instrucciones / datos)</td></tr><tr><td>Buses</td><td>Uno compartido</td><td>Dos independientes</td></tr><tr><td>Acceso simultáneo</td><td>No</td><td>Sí</td></tr><tr><td>Uso</td><td>PC de propósito general</td><td>DSP, microcontroladores, cachés L1</td></tr></tbody></table></div>
<h5>Mejora 1 · Segmentación (pipeline) de 5 etapas</h5>
<p>Como una línea de ensamblaje: mientras una instrucción se ejecuta, la siguiente ya se decodifica.</p>
<div class="tabla-wrap"><table class="pipe-u4"><thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr></thead><tbody><tr><th>Instr. 1</th><td><span class="st st0">IF</span></td><td><span class="st st1">ID</span></td><td><span class="st st2">EX</span></td><td><span class="st st3">MEM</span></td><td><span class="st st4">WB</span></td><td></td><td></td><td></td><td></td></tr><tr><th>Instr. 2</th><td></td><td><span class="st st0">IF</span></td><td><span class="st st1">ID</span></td><td><span class="st st2">EX</span></td><td><span class="st st3">MEM</span></td><td><span class="st st4">WB</span></td><td></td><td></td><td></td></tr><tr><th>Instr. 3</th><td></td><td></td><td><span class="st st0">IF</span></td><td><span class="st st1">ID</span></td><td><span class="st st2">EX</span></td><td><span class="st st3">MEM</span></td><td><span class="st st4">WB</span></td><td></td><td></td></tr><tr><th>Instr. 4</th><td></td><td></td><td></td><td><span class="st st0">IF</span></td><td><span class="st st1">ID</span></td><td><span class="st st2">EX</span></td><td><span class="st st3">MEM</span></td><td><span class="st st4">WB</span></td><td></td></tr><tr><th>Instr. 5</th><td></td><td></td><td></td><td></td><td><span class="st st0">IF</span></td><td><span class="st st1">ID</span></td><td><span class="st st2">EX</span></td><td><span class="st st3">MEM</span></td><td><span class="st st4">WB</span></td></tr></tbody></table></div>
<p class="nota">IF búsqueda · ID decodificación · EX ejecución · MEM memoria · WB escritura. Sin pipeline: 5 instrucciones × 5 ciclos = 25 ciclos. Con pipeline: 9 ciclos. En régimen estable, 1 instrucción por ciclo.</p>
<h5>Riesgos (hazards) del pipeline</h5>
<div class="info-grid"><div class="info-card"><h5>Estructurales</h5><p>Dos instrucciones necesitan el mismo recurso al mismo tiempo. Solución: duplicar recursos, arquitectura Harvard.</p></div><div class="info-card"><h5>De datos</h5><p>Una instrucción necesita un resultado que la anterior todavía no termina.</p><div class="codigo">ADD R1, R2, R3<br>SUB R4, <b>R1</b>, R5</div><p>Solución: adelantamiento (forwarding), burbujas.</p></div><div class="info-card"><h5>De control</h5><p>Un salto (if, ciclo) cambia el flujo y las instrucciones ya cargadas sobran. Solución: predicción de saltos, salto retardado.</p></div></div>
<h5>Mejora 2 · Técnicas que exprimen al núcleo secuencial</h5>
<div class="info-grid"><div class="info-card"><h5>Superescalar</h5><p>Varias unidades de ejecución: emite 2, 4 o más instrucciones por ciclo.</p></div><div class="info-card"><h5>Ejecución fuera de orden</h5><p>El hardware reordena instrucciones independientes para no esperar.</p></div><div class="info-card"><h5>VLIW</h5><p>El compilador empaqueta varias operaciones en una instrucción muy larga (Intel Itanium).</p></div><div class="info-card"><h5>Multihilo simultáneo (SMT)</h5><p>Un núcleo atiende 2 hilos a la vez (Hyper-Threading de Intel).</p></div></div>
<h5>Mejora 3 · Jerarquía de memoria</h5>
<p>Memorias pequeñas y rápidas cerca del procesador; grandes y lentas lejos. Funciona por el principio de <strong>localidad</strong>: temporal (lo que usé, lo vuelvo a usar) y espacial (uso lo que está cerca).</p>

6" class="grid"/><text x="680" y="312" class="ts" font-size="17" text-anchor="start">≈ 50–150 µs · TB</text><path d="M50.0 332 L550.0 332 L585.0 380 L15.0 380 Z" class="pyr" style="fill-opacity:0.4"/><text x="300" y="362" class="tl dark" font-size="18" text-anchor="middle">Disco duro</text><line x1="593.0" y1="358" x2="670" y2="358" class="grid"/><text x="680" y="364" class="ts" font-size="17" text-anchor="start">≈ 5–10 ms · TB</text></svg><figcaption>Jerarquía de memoria: más rápida arriba, más capacidad abajo (valores aproximados).</figcaption></figure>
<h4 id="s-4-2-3">4.2.3 Organización de direcciones de memoria</h4>
<p>Define quién puede ver qué memoria y cuánto tarda en llegar a ella.</p>
<h5>Espacio de direcciones: compartido o distribuido</h5>
<div class="svg-par"><figure class="fig-svg fig-svg-chica"><svg class="dg" viewBox="0 0 400 256" role="img" aria-label="Espacio de direcciones compartido"><rect x="20" y="20" width="75" height="46" rx="10" class="bx hi"/><text x="57.5" y="49.3" class="tl" font-size="18" text-anchor="middle">P0</text><line x1="57" y1="66" x2="57" y2="120" class="ln d flow"/><rect x="115" y="20" width="75" height="46" rx="10" class="bx hi"/><text x="152.5" y="49.3" class="tl" font-size="18" text-anchor="middle">P1</text><line x1="152" y1="66" x2="152" y2="120" class="ln d flow"/><rect x="210" y="20" width="75" height="46" rx="10" class="bx hi"/><text x="247.5" y="49.3" class="tl" font-size="18" text-anchor="middle">P2</text><line x1="247" y1="66" x2="247" y2="120" class="ln d flow"/><rect x="305" y="20" width="75" height="46" rx="10" class="bx hi"/><text x="342.5" y="49.3" class="tl" font-size="18" text-anchor="middle">P3</text><line x1="342" y1="66" x2="342" y2="120" class="ln d flow"/><rect x="20" y="120" width="360" height="90" rx="10" class="bx"/><text x="200.0" y="171.3" class="tl" font-size="18" text-anchor="middle">Un solo espacio de direcciones</text><text x="200" y="194" class="mono" font-size="16" text-anchor="middle">0x0000_0000 … 0xFFFF_FFFF</text><text x="200" y="240" class="lab c1" font-size="16" text-anchor="middle">Comunicación: LOAD / STORE</text></svg><figcaption>Espacio compartido: todos ven la misma memoria.</figcaption></figure>
<figure class="fig-svg fig-svg-chica"><svg class="dg" viewBox="0 0 400 256" role="img" aria-label="Espacio de direcciones distribuido"><rect x="12" y="10" width="84" height="150" rx="10" class="bx soft"/><rect x="20" y="20" width="68" height="42" rx="10" class="bx hi"/><text x="54.0" y="46.95" class="tl" font-size="17" text-anchor="middle">P0</text><rect x="20" y="76" width="68" height="74" rx="10" class="bx"/><text x="54.0" y="111.0" class="tl" font-size="17" text-anchor="middle">M0</text><text x="54.0" y="130.0" class="ts" font-size="13" text-anchor="middle">0…N</text><line x1="54" y1="160" x2="54" y2="192" class="ln d"/><rect x="108" y="10" width="84" height="150" rx="10" class="bx soft"/><rect x="116" y="20" width="68" height="42" rx="10" class="bx hi"/><text x="150.0" y="46.95" class="tl" font-size="17" text-anchor="middle">P1</text><rect x="116" y="76" width="68" height="74" rx="10" class="bx"/><text x="150.0" y="111.0" class="tl" font-size="17" text-anchor="middle">M1</text><text x="150.0" y="130.0" class="ts" font-size="13" text-anchor="middle">0…N</text><line x1="150" y1="160" x2="150" y2="192" class="ln d"/><rect x="204" y="10" width="84" height="150" rx="10" class="bx soft"/><rect x="212" y="20" width="68" height="42" rx="10" class="bx hi"/><text x="246.0" y="46.95" class="tl" font-size="17" text-anchor="middle">P2</text><rect x="212" y="76" width="68" height="74" rx="10" class="bx"/><text x="246.0" y="111.0" class="tl" font-size="17" text-anchor="middle">M2</text><text x="246.0" y="130.0" class="ts" font-size="13" text-anchor="middle">0…N</text><line x1="246" y1="160" x2="246" y2="192" class="ln d"/><rect x="300" y="10" width="84" height="150" rx="10" class="bx soft"/><rect x="308" y="20" width="68" height="42" rx="10" class="bx hi"/><text x="342.0" y="46.95" class="tl" font-size="17" text-anchor="middle">P3</text><rect x="308" y="76" width="68" height="74" rx="10" class="bx"/><text x="342.0" y="111.0" class="tl" font-size="17" text-anchor="middle">M3</text><text x="342.0" y="130.0" class="ts" font-size="13" text-anchor="middle">0…N</text><line x1="342" y1="160" x2="342" y2="192" class="ln d"/><rect x="10" y="192" width="380" height="20" rx="6" class="busbar"/><text x="200" y="207" class="tl dark" font-size="14" text-anchor="middle">red de interconexión</text><circle r="7" class="pk alt"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M 54 160 L 54 202 L 342 202 L 342 160"/></circle><text x="200" y="240" class="lab c2" font-size="16" text-anchor="middle">Comunicación: SEND / RECEIVE</text></svg><figcaption>Espacio distribuido: memoria privada y mensajes.</figcaption></figure>

<ul><li><strong>Compartido:</strong> todos los procesadores ven la misma memoria y una dirección significa lo mismo para todos.</li><li><strong>Distribuido:</strong> cada procesador tiene su memoria privada y para compartir datos se envían mensajes.</li></ul>

P3</text><rect x="288" y="92" width="66" height="54" rx="10" class="bx"/><text x="321.0" y="117.0" class="tl" font-size="17" text-anchor="middle">AM</text><text x="321.0" y="136.0" class="ts" font-size="13" text-anchor="middle">atracción</text><line x1="321" y1="56" x2="321" y2="92" class="ln d"/><line x1="321" y1="156" x2="321" y2="196" class="ln d"/><rect x="10" y="196" width="352" height="20" rx="6" class="busbar"/><text x="186" y="211" class="tl dark" font-size="14" text-anchor="middle">directorio + red</text><circle r="6" class="pk alt"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M 321 146 L 321 206 L 51 206 L 51 146"/></circle><text x="186" y="236" class="ts" font-size="14" text-anchor="middle">los datos migran a quien los usa</text></svg><figcaption>COMA: toda la memoria actúa como caché.</figcaption></figure>
</div>
<div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Modelo</th><th>Significado</th><th>Característica</th></tr></thead><tbody><tr><td>UMA</td><td>Uniform Memory Access</td><td>Mismo tiempo de acceso a cualquier dirección. Típico de SMP con bus.</td></tr><tr><td>NUMA</td><td>Non-Uniform Memory Access</td><td>Memoria local rápida, remota lenta. Con coherencia de caché: CC-NUMA.</td></tr><tr><td>COMA</td><td>Cache-Only Memory Architecture</td><td>Toda la memoria funciona como caché; los datos migran.</td></tr></tbody></table></div>
<h5>Entrelazado de memoria (interleaving)</h5>
<div class="ilv"><div class="mod"><div class="mh">Módulo M0</div><div class="cell" style="--d:0">0</div><div class="cell" style="--d:4">4</div><div class="cell" style="--d:8">8</div><div class="cell" style="--d:12">12</div></div><div class="mod"><div class="mh">Módulo M1</div><div class="cell" style="--d:1">1</div><div class="cell" style="--d:5">5</div><div class="cell" style="--d:9">9</div><div class="cell" style="--d:13">13</div></div><div class="mod"><div class="mh">Módulo M2</div><div class="cell" style="--d:2">2</div><div class="cell" style="--d:6">6</div><div class="cell" style="--d:10">10</div><div class="cell" style="--d:14">14</div></div><div class="mod"><div class="mh">Módulo M3</div><div class="cell" style="--d:3">3</div><div class="cell" style="--d:7">7</div><div class="cell" style="--d:11">11</div><div class="cell" style="--d:15">15</div></div></div>
<ul><li>La memoria se divide en <strong>módulos</strong> (bancos) que pueden trabajar en paralelo.</li><li><strong>Orden bajo:</strong> módulo = dirección mod m. Direcciones consecutivas caen en módulos distintos, así un acceso secuencial usa los 4 módulos a la vez.</li><li><strong>Orden alto:</strong> los bits altos eligen el módulo; bloques contiguos en el mismo módulo. Útil para que cada procesador tenga su región.</li></ul>
<h5>Direcciones virtuales y físicas</h5>
<figure class="fig-svg fig-svg-chica"><svg class="dg" viewBox="0 0 470 400" role="img" aria-label="Traducción virtual a física"><rect x="20" y="60" width="170" height="56" rx="10" class="bx hi"/><text x="105.0" y="94.65" class="tl" font-size="19" text-anchor="middle">Nº página</text><rect x="190" y="60" width="150" height="56" rx="10" class="bx"/><text x="265.0" y="94.65" class="tl" font-size="19" text-anchor="middle">desplaz.</text><text x="180" y="40" class="ts" font-size="17" text-anchor="middle">Dirección virtual</text><line x1="105" y1="116" x2="105" y2="190" class="ln i flow"/><line x1="265" y1="116" x2="265" y2="300" class="ln d flow"/><rect x="20" y="190" width="200" height="70" rx="10" class="bx hi"/><text x="120.0" y="223.0" class="tl" font-size="22" text-anchor="middle">TLB</text><text x="120.0" y="247.0" class="ts" font-size="18" text-anchor="middle">caché de traducciones</text><line x1="220" y1="225" x2="260" y2="225" class="ln i"/><rect x="260" y="190" width="190" height="70" rx="10" class="bx"/><text x="355.0" y="223.0" class="tl" font-size="17" text-anchor="middle">Tabla de páginas</text><text x="355.0" y="242.0" class="ts" font-size="13" text-anchor="middle">si falla la TLB</text><line x1="110" y1="260" x2="110" y2="300" class="ln i flow"/><rect x="20" y="300" width="170" height="56" rx="10" class="bx hi"/><text x="105.0" y="334.65" class="tl" font-size="19" text-anchor="middle">Nº marco</text><rect x="190" y="300" width="150" height="56" rx="10" class="bx"/><text x="265.0" y="334.65" class="tl" font-size="19" text-anchor="middle">desplaz.</text><text x="180" y="386" class="ts" font-size="17" text-anchor="middle">Dirección física → RAM</text></svg><figcaption>MMU: la dirección virtual se traduce con la TLB o la tabla de páginas.</figcaption></figure>
<ul><li>Cada programa usa <strong>direcciones virtuales</strong> como si tuviera toda la memoria para él; la MMU traduce a <strong>direcciones físicas</strong> mediante tablas de páginas.</li><li>La TLB guarda traducciones recientes para no consultar la tabla siempre.</li><li>En multiprocesadores, varios hilos comparten la misma tabla de páginas; en multicomputadores, cada nodo tiene su propio espacio físico independiente.</li></ul>
<h3 id="s-4-3">4.3 Sistemas de memoria compartida: multiprocesadores</h3>
<p>Varios procesadores, una sola memoria. Rápido de programar, difícil de escalar.</p>
<ul><li>Sistema MIMD con dos o más procesadores que comparten un <strong>espacio de direcciones único</strong>.</li><li>Se comunican escribiendo y leyendo variables compartidas (LOAD/STORE) y un solo sistema operativo controla a todos.</li><li>Ejemplos: SMP de servidores, procesadores multinúcleo de PC y celulares.</li><li>Programación con hilos: <strong>Pthreads</strong>, <strong>OpenMP</strong>, hilos de Java.</li></ul>
<h5>Coherencia de caché</h5>
<div class="info-grid"><div class="info-card"><h5>Paso 1</h5><p>P1 lee X de memoria. Su caché guarda <span class="flujo">X = 5</span>.</p></div><div class="info-card"><h5>Paso 2</h5><p>P2 lee X. Su caché también guarda <span class="flujo">X = 5</span>.</p></div><div class="info-card"><h5>Paso 3 · ¡Problema!</h5><p>P1 escribe <span class="flujo">X = 7</span> en su caché. P2 sigue viendo <span class="flujo">X = 5</span>: datos inconsistentes.</p></div></div>
<div class="info-grid"><div class="info-card"><h5>Invalidación</h5><p>Al escribir, se invalidan las demás copias; los otros deben volver a leer. Es la opción más usada.</p></div><div class="info-card"><h5>Actualización</h5><p>Al escribir, se envía el nuevo valor a todas las cachés que tienen copia. Genera más tráfico.</p></div></div>
<h5>Snooping vs. directorio</h5>
<div class="info-grid"><div class="info-card"><h5>Snooping (espionaje del bus)</h5><ul><li>Cada caché «escucha» todas las transacciones del bus.</li><li>Si ve una escritura a un dato que tiene, lo invalida.</li><li>Simple y rápido con pocos procesadores; no escala porque el bus se satura.</li></ul></div><div class="info-card"><h5>Basado en directorio</h5><ul><li>Un directorio registra qué cachés tienen copia de cada bloque.</li><li>Solo se avisa a quienes tienen copia (mensajes punto a punto).</li><li>Escala a cientos de procesadores (CC-NUMA); cuesta memoria extra y más latencia.</li></ul></div></div>
<h5>Protocolo MESI</h5>
<div class="info-grid"><div class="info-card"><h5>M · Modificado</h5><p>Solo esta caché lo tiene y está cambiado. Memoria desactualizada.</p></div><div class="info-card"><h5>E · Exclusivo</h5><p>Solo esta caché lo tiene, igual que memoria.</p></div><div class="info-card"><h5>S · Compartido</h5><p>Varias cachés lo tienen, todas iguales a memoria.</p></div><div class="info-card"><h5>I · Inválido</h5><p>La copia no sirve; hay que volver a leer.</p></div></div>
<div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Evento</th><th>Transición</th></tr></thead><tbody><tr><td>Lectura propia, nadie más lo tiene</td><td>I → E</td></tr><tr><td>Lectura propia, otros lo tienen</td><td>I → S</td></tr><tr><td>Escritura propia</td><td>S/E/I → M (invalida otras copias)</td></tr><tr><td>Otro procesador lee mi bloque modificado</td><td>M → S (se escribe a memoria)</td></tr><tr><td>Otro procesador quiere escribir</td><td>M/E/S → I</td></tr></tbody></table></div>
<h5>Sincronización en memoria compartida</h5>
<p><strong>Condición de carrera:</strong> dos hilos ejecutan <span class="flujo">contador++</span> al mismo tiempo (leer → sumar → escribir) y uno de los incrementos se pierde.</p>
<div class="codigo">hilo A: lee 10 → escribe 11<br>hilo B: lee 10 → escribe 11<br><span class="k">// esperado: 12</span></div>
<ul><li><strong>Candados (locks / mutex):</strong> solo un hilo en la sección crítica.</li><li><strong>Instrucciones atómicas:</strong> test-and-set, compare-and-swap.</li><li><strong>Semáforos:</strong> contadores para recursos compartidos.</li><li><strong>Barreras:</strong> todos esperan a que todos lleguen.</li><li><strong>Modelo de consistencia:</strong> reglas sobre el orden en que se ven las escrituras.</li></ul>
<div class="pros-cons"><div class="pro"><h6>Ventajas</h6><ul><li>Programación más sencilla: los datos están ahí.</li><li>Comunicación muy rápida (a velocidad de memoria).</li><li>Fácil migrar programas secuenciales.</li><li>Un solo sistema operativo.</li></ul></div><div class="contra"><h6>Desventajas</h6><ul><li>Escalabilidad limitada por el bus o la red.</li><li>Coherencia de caché costosa.</li><li>Contención: muchos procesadores peleando por la misma memoria.</li><li>Hardware más caro al crecer.</li></ul></div></div>
<h4 id="s-4-3-1">4.3.1 Redes de interconexión dinámicas (indirectas)</h4>
<ul><li>Las conexiones se establecen <strong>en tiempo de ejecución</strong> mediante conmutadores (switches).</li><li>Se llaman <strong>indirectas</strong> porque los procesadores no están unidos directamente entre sí, sino a través de la red.</li><li>Se usan para unir procesadores con módulos de memoria en multiprocesadores.</li><li>Dos familias: <strong>medio compartido</strong> (bus único o múltiples buses) y <strong>conmutadas</strong> (crossbar, Omega, Butterfly, Benes, Clos).</li></ul>
<h5>Red de bus</h5>

0" class="bx hi"/><text x="835.0" y="67.7" class="tl" font-size="22" text-anchor="middle">P3</text><rect x="750" y="96" width="170" height="40" rx="10" class="bx"/><text x="835.0" y="121.6" class="tl" font-size="16" text-anchor="middle">caché</text><line x1="835" y1="136" x2="835" y2="170" class="ln d"/><line x1="835" y1="196" x2="835" y2="236" class="ln d"/><rect x="750" y="236" width="170" height="70" rx="10" class="bx hi"/><text x="835.0" y="269.0" class="tl" font-size="20" text-anchor="middle">Árbitro</text><text x="835.0" y="291.0" class="ts" font-size="16" text-anchor="middle">decide quién usa el bus</text><circle r="8" class="pk"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M 145 136 L 145 183 L 375 183 L 375 236"/></circle><circle r="8" class="pk alt"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M 605 236 L 605 183 L 835 183 L 835 136"/></circle></svg><figcaption>Red de bus: una sola transferencia a la vez; el árbitro decide el turno.</figcaption></figure>
<div class="info-grid"><div class="info-card"><h5>Cómo funciona</h5><p>Todos se conectan a un mismo canal. Solo una transferencia a la vez; un árbitro decide el turno.</p></div><div class="info-card"><h5>A favor</h5><p>Simple, barato (costo O(N)), permite difusión (broadcast) y facilita el snooping.</p></div><div class="info-card"><h5>En contra</h5><p>El ancho de banda se reparte entre todos: útil solo para pocos procesadores (decenas).</p></div></div>

<ul><li>Una matriz de N × M conmutadores: cada procesador puede conectarse a cualquier memoria.</li><li>Es <strong>no bloqueante</strong>: varias conexiones simultáneas si van a destinos distintos, con latencia constante.</li><li>Costo O(N²): con 1 000 procesadores se necesitan 1 000 000 de conmutadores.</li><li>Uso real: dentro de chips y en switches de red de alta gama.</li></ul>

<div class="info-grid"><div class="info-card"><h5>Otras redes multietapa</h5><ul><li><strong>Butterfly:</strong> base de la FFT y de muchos switches.</li><li><strong>Baseline:</strong> topológicamente equivalente a Omega.</li><li><strong>Benes:</strong> 2·log₂N − 1 etapas, reconfigurable sin bloqueo.</li><li><strong>Clos (1953):</strong> diseñada para telefonía; hoy en centros de datos.</li></ul></div><div class="info-card"><h5>Enrutamiento por etiqueta de destino</h5><p>En cada etapa se mira un bit del destino (del más significativo al menos): <strong>0</strong> → salida superior, <strong>1</strong> → salida inferior. No necesita tablas.</p></div></div>
<h5>Comparativa de redes dinámicas (N procesadores)</h5>
<div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Característica</th><th>Bus</th><th>Multietapa (Omega)</th><th>Crossbar</th></tr></thead><tbody><tr><td>Costo en conmutadores</td><td>O(N)</td><td>O(N log N)</td><td>O(N²)</td></tr><tr><td>Latencia</td><td>Constante</td><td>O(log N)</td><td>Constante</td></tr><tr><td>Ancho de banda por procesador</td><td>O(1/N)</td><td>O(1) a O(1/N)</td><td>O(1)</td></tr><tr><td>Bloqueo</td><td>Sí (una a la vez)</td><td>Parcial</td><td>No</td></tr><tr><td>Escalabilidad</td><td>Baja</td><td>Media</td><td>Alta en rendimiento, baja en costo</td></tr></tbody></table></div>
<p class="nota">Regla práctica: bus para pocos núcleos, crossbar dentro del chip, multietapa para escalas intermedias.</p>
<h5>Técnicas de conmutación</h5>
<div class="info-grid"><div class="info-card"><h5>Conmutación de circuitos</h5><p>Se reserva un camino completo antes de enviar. Como una llamada telefónica.</p></div><div class="info-card"><h5>Conmutación de paquetes</h5><p>El mensaje se divide en paquetes que se enrutan por separado. Mejor uso de la red.</p></div><div class="info-card"><h5>Store-and-forward</h5><p>Cada nodo recibe el paquete completo antes de reenviarlo. Latencia ∝ distancia × tamaño.</p></div><div class="info-card"><h5>Wormhole / cut-through</h5><p>Se reenvía en cuanto llega la cabecera. Latencia casi independiente de la distancia. Usado en supercomputadoras.</p></div></div>
<h3 id="s-4-4">4.4 Sistemas de memoria distribuida: multicomputadores</h3>
<p>Cada nodo es una computadora completa. Escala a millones de núcleos.</p>

te" path="M 480 330 L 480 220 L 480 110"/></circle></svg><figcaption>Multicomputador: cada nodo tiene procesador, memoria local e interfaz de red.</figcaption></figure>
<ul><li>Conjunto de nodos, cada uno con <strong>procesador + memoria local + interfaz de red</strong> (NI); no existe un espacio de direcciones global.</li><li>Los nodos cooperan <strong>enviando mensajes</strong> por una red de interconexión y cada uno suele ejecutar su propia copia del sistema operativo.</li><li>Ejemplos: clústeres Beowulf, MPP, supercomputadoras del TOP500.</li></ul>
<h5>Paso de mensajes con MPI</h5>
<ul><li><strong>MPI</strong> (Message Passing Interface) es el estándar desde 1994, con <strong>Send / Receive</strong> punto a punto.</li><li><strong>Síncrono:</strong> el emisor espera a que el receptor reciba. <strong>Asíncrono:</strong> sigue trabajando.</li><li>Operaciones colectivas: Bcast (difusión), Scatter, Gather, Reduce.</li><li>Compilar: <span class="flujo">mpicc</span> · ejecutar: <span class="flujo">mpirun -np 4 ./prog</span></li></ul>
<div class="codigo"><span class="k">// rank 0 envía, rank 1 recibe</span><br>int rank, dato = 42;<br>MPI_Init(&amp;argc, &amp;argv);<br>MPI_Comm_rank(MPI_COMM_WORLD, &amp;rank);<br>if (rank == 0)<br>&nbsp;&nbsp;MPI_<b>Send</b>(&amp;dato, 1, MPI_INT, 1, 0, MPI_COMM_WORLD);<br>else if (rank == 1)<br>&nbsp;&nbsp;MPI_<b>Recv</b>(&amp;dato, 1, MPI_INT, 0, 0,<br>&nbsp;&nbsp;&nbsp;&nbsp;MPI_COMM_WORLD, MPI_STATUS_IGNORE);<br>MPI_Finalize();</div>
<div class="pros-cons"><div class="pro"><h6>Ventajas</h6><ul><li>Escalan a miles o millones de núcleos.</li><li>No hay problema de coherencia de caché global.</li><li>Se construyen con hardware común (clústeres).</li><li>Un fallo de nodo no tumba todo el sistema.</li></ul></div><div class="contra"><h6>Desventajas</h6><ul><li>Programación más difícil: el programador mueve los datos.</li><li>Comunicación más lenta que la memoria.</li><li>Hay que repartir los datos con cuidado.</li><li>Depuración distribuida compleja.</li></ul></div></div>
<h5>Memoria compartida vs. distribuida</h5>
<div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Aspecto</th><th>Multiprocesador (compartida)</th><th>Multicomputador (distribuida)</th></tr></thead><tbody><tr><td>Espacio de direcciones</td><td>Único y global</td><td>Privado por nodo</td></tr><tr><td>Comunicación</td><td>Variables compartidas</td><td>Mensajes</td></tr><tr><td>Red típica</td><td>Dinámica: bus, crossbar, multietapa</td><td>Estática: malla, toro, hipercubo, árbol</td></tr><tr><td>Coherencia</td><td>Necesaria (MESI, directorio)</td><td>No aplica</td></tr><tr><td>Escalabilidad</td><td>Decenas a cientos</td><td>Miles a millones</td></tr><tr><td>Programación</td><td>OpenMP, Pthreads</td><td>MPI</td></tr></tbody></table></div>

" class="tl" font-size="17" text-anchor="middle">Memoria compartida</text><text x="460" y="222" class="lab c1" font-size="15" text-anchor="middle">OpenMP / hilos</text><line x1="460" y1="240" x2="460" y2="280" class="ln d"/><rect x="630" y="20" width="260" height="220" rx="16" class="bx soft"/><text x="760" y="50" class="tl" font-size="19" text-anchor="middle">Nodo 2</text><rect x="645" y="66" width="50" height="46" rx="10" class="bx hi"/><text x="670.0" y="94.25" class="tl" font-size="15" text-anchor="middle">C0</text><rect x="705" y="66" width="50" height="46" rx="10" class="bx hi"/><text x="730.0" y="94.25" class="tl" font-size="15" text-anchor="middle">C1</text><rect x="765" y="66" width="50" height="46" rx="10" class="bx hi"/><text x="790.0" y="94.25" class="tl" font-size="15" text-anchor="middle">C2</text><rect x="825" y="66" width="50" height="46" rx="10" class="bx hi"/><text x="850.0" y="94.25" class="tl" font-size="15" text-anchor="middle">C3</text><rect x="645" y="140" width="230" height="54" rx="10" class="bx"/><text x="760.0" y="172.95" class="tl" font-size="17" text-anchor="middle">Memoria compartida</text><text x="760" y="222" class="lab c1" font-size="15" text-anchor="middle">OpenMP / hilos</text><line x1="760" y1="240" x2="760" y2="280" class="ln d"/><rect x="30" y="280" width="860" height="24" rx="8" class="busbar"/><text x="460" y="297" class="tl dark" font-size="15" text-anchor="middle">Red del clúster → MPI (paso de mensajes)</text><circle r="8" class="pk env"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M 160 240 L 160 292 L 760 292 L 760 240"/></circle></svg><figcaption>Sistema híbrido: memoria compartida dentro del nodo y paso de mensajes entre nodos.</figcaption></figure>
<p class="nota">Dentro de cada nodo: memoria compartida (multinúcleo + GPU). Entre nodos: memoria distribuida. Así funcionan todas las supercomputadoras actuales.</p>
<h4 id="s-4-4-1">4.4.1 Redes de interconexión estáticas</h4>
<p>Enlaces fijos punto a punto entre nodos. La forma de la red define su rendimiento.</p>
<h5>Métricas de las redes estáticas</h5>
<div class="info-grid"><div class="info-card"><h5>Diámetro</h5><p>Distancia máxima (en saltos) entre dos nodos cualesquiera. Menor = menor latencia.</p></div><div class="info-card"><h5>Grado</h5><p>Número de enlaces por nodo. Mayor grado = más puertos y más costo.</p></div><div class="info-card"><h5>Ancho de bisección</h5><p>Mínimo de enlaces que hay que cortar para partir la red en dos mitades iguales. Mide el ancho de banda global.</p></div><div class="info-card"><h5>Costo</h5><p>Número total de enlaces.</p></div><div class="info-card"><h5>Conectividad de arco</h5><p>Mínimo de enlaces que deben fallar para desconectar la red. Mide la tolerancia a fallos.</p></div><div class="info-card"><h5>Simetría</h5><p>La red se ve igual desde cualquier nodo: simplifica el enrutamiento.</p></div></div>

<h5>Árbol y árbol grueso (fat tree)</h5>
<figure class="fig-svg fig-svg-chica"><svg class="dg" viewBox="0 0 300 210" role="img" aria-label="Árbol binario"><line x1="150" y1="25" x2="80" y2="95" class="ln t"/><line x1="150" y1="25" x2="220" y2="95" class="ln t"/><line x1="80" y1="95" x2="45" y2="175" class="ln t"/><line x1="80" y1="95" x2="115" y2="175" class="ln t"/><line x1="220" y1="95" x2="185" y2="175" class="ln t"/><line x1="220" y1="95" x2="255" y2="175" class="ln t"/><circle cx="150" cy="25" r="9" class="node"/><circle cx="80" cy="95" r="9" class="node"/><circle cx="220" cy="95" r="9" class="node"/><circle cx="45" cy="175" r="9" class="node"/><circle cx="115" cy="175" r="9" class="node"/><circle cx="185" cy="175" r="9" class="node"/><circle cx="255" cy="175" r="9" class="node"/><path d="M 45 175 L 80 95 L 150 25 L 220 95 L 255 175" class="hl thin"/><circle r="6" class="pk"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 45 175 L 80 95 L 150 25 L 220 95 L 255 175"/></circle></svg><figcaption>Árbol binario: la raíz concentra el tráfico.</figcaption></figure>

<h5>Hipercubo</h5>
<figure class="fig-svg fig-svg-chica"><svg class="dg" viewBox="0 0 300 215" role="img" aria-label="Hipercubo de 3 dimensiones"><line x1="70" y1="140" x2="170" y2="140" class="ln t"/><line x1="70" y1="140" x2="70" y2="60" class="ln t"/><line x1="70" y1="140" x2="130" y2="175" class="ln t"/><line x1="170" y1="140" x2="170" y2="60" class="ln t"/><line x1="170" y1="140" x2="230" y2="175" class="ln t"/><line x1="70" y1="60" x2="170" y2="60" class="ln t"/><line x1="70" y1="60" x2="130" y2="95" class="ln t"/><line x1="170" y1="60" x2="230" y2="95" class="ln t"/><line x1="130" y1="175" x2="230" y2="175" class="ln t"/><line x1="130" y1="175" x2="130" y2="95" class="ln t"/><line x1="230" y1="175" x2="230" y2="95" class="ln t"/><line x1="130" y1="95" x2="230" y2="95" class="ln t"/><circle cx="70" cy="140" r="9" class="node"/><text x="70" y="166" class="mono" font-size="12" text-anchor="middle">000</text><circle cx="170" cy="140" r="9" class="node"/><text x="170" y="166" class="mono" font-size="12" text-anchor="middle">001</text><circle cx="70" cy="60" r="9" class="node"/><text x="70" y="44" class="mono" font-size="12" text-anchor="middle">010</text><circle cx="170" cy="60" r="9" class="node"/><text x="170" y="44" class="mono" font-size="12" text-anchor="middle">011</text><circle cx="130" cy="175" r="9" class="node"/><text x="130" y="201" class="mono" font-size="12" text-anchor="middle">100</text><circle cx="230" cy="175" r="9" class="node"/><text x="230" y="201" class="mono" font-size="12" text-anchor="middle">101</text><circle cx="130" cy="95" r="9" class="node"/><text x="130" y="79" class="mono" font-size="12" text-anchor="middle">110</text><circle cx="230" cy="95" r="9" class="node"/><text x="230" y="79" class="mono" font-size="12" text-anchor="middle">111</text><path d="M 70 140 L 170 140 L 230 175" class="hl thin"/><circle r="6" class="pk"><animateMotion dur="2.1s" begin="0s" repeatCount="indefinite" path="M 70 140 L 170 140 L 230 175"/></circle></svg><figcaption>Hipercubo 3D: 8 nodos; los vecinos difieren en un solo bit.</figcaption></figure>
<ul><li>Un hipercubo de dimensión d tiene <strong>2ᵈ nodos</strong>; cada nodo se etiqueta con d bits y dos nodos son vecinos si sus etiquetas difieren en <strong>un solo bit</strong>.</li><li>Grado = diámetro = d = log₂p. Bisección p/2. Se construye recursivamente: un 4D son dos 3D unidos (16 nodos y 32 enlaces).</li><li>Usado en Cosmic Cube (Caltech, 1983), Intel iPSC y Connection Machine CM-2.</li></ul>

<ul><li><strong>Enrutamiento XY</strong> (orden de dimensión) en mallas: primero avanza en X hasta la columna destino, luego en Y. Es determinista y evita interbloqueos.</li><li><strong>E-cube</strong> en hipercubos: se corrigen los bits diferentes de uno en uno. De 000 a 101: 000 → 001 → 101.</li><li><strong>Adaptativo:</strong> elige rutas alternas si hay congestión.</li></ul>

<h5>Caso 4 · El procesador multinúcleo de tu laptop</h5>
<div class="info-grid"><div class="info-card"><h5>Arquitectura</h5><ul><li>Entre 4 y 24 núcleos en un chip, cada uno con caché L1 y L2 privadas.</li><li>Caché L3 compartida entre núcleos.</li><li>Red interna: anillo o malla que une núcleos, L3 y controlador de memoria.</li><li>Algunos diseños mezclan núcleos de alto rendimiento y de eficiencia (big.LITTLE).</li></ul></div><div class="info-card"><h5>Relación con la unidad</h5><ul><li>Es un <strong>multiprocesador UMA</strong> en pequeño (4.3).</li><li>Usa un protocolo de coherencia tipo MESI (o variantes MOESI / MESIF).</li><li>Los procesadores con varios chiplets se comportan como <strong>NUMA</strong>.</li><li>Cada núcleo tiene pipeline superescalar (4.2.2).</li></ul></div></div>

<ul><li>Matrices de n × n: el algoritmo secuencial hace n³ multiplicaciones. Se divide C en bloques y cada procesador calcula uno (con 4 procesadores y bloques de 2 × 2, cada uno hace ¼ del trabajo).</li><li>En memoria compartida: cada hilo lee A y B directamente (OpenMP).</li><li>En memoria distribuida: hay que enviar filas y columnas (algoritmo de Cannon en malla toroidal).</li></ul>

<div class="quiz-u4"><details><summary><b>1</b> ¿Qué clase de Flynn describe a una GPU?</summary><p><strong>SIMD (modelo SIMT).</strong> Una GPU ejecuta la misma instrucción sobre muchos datos a la vez: agrupa hilos de 32 en 32 (warps en NVIDIA) que avanzan juntos. Por eso es ideal para imágenes, matrices y entrenamiento de modelos de IA.</p></details><details><summary><b>2</b> Si f = 0.8, ¿cuál es la aceleración máxima según Amdahl?</summary><p><strong>1 / (1 − 0.8) = 1 / 0.2 = 5×.</strong> Aunque se usen infinitos procesadores, el 20 % secuencial del programa limita la aceleración a 5 veces.</p></details><details><summary><b>3</b> ¿Qué red tiene costo O(N²) y no es bloqueante?</summary><p><strong>La red crossbar (barras cruzadas).</strong> Es una matriz de N × M conmutadores que permite varias conexiones simultáneas a destinos distintos con latencia constante, pero con 1 000 procesadores se necesitarían 1 000 000 de conmutadores.</p></details><details><summary><b>4</b> En MESI, ¿qué estado indica que solo yo tengo el dato y está modificado?</summary><p><strong>M · Modificado.</strong> Solo esa caché tiene el bloque y su valor es distinto al de la memoria principal, que quedó desactualizada. Si otro procesador lo lee, el bloque pasa a S (Compartido) y se escribe a memoria.</p></details><details><summary><b>5</b> ¿Cuántos nodos y qué diámetro tiene un hipercubo de dimensión 4?</summary><p><strong>16 nodos y diámetro 4.</strong> Un hipercubo de dimensión d tiene 2ᵈ nodos (2⁴ = 16) y su diámetro y grado son d = log₂p = 4. Tiene además 32 enlaces y una bisección de p/2 = 8.</p></details><details><summary><b>6</b> ¿Cómo se comunican los nodos de un multicomputador?</summary><p><strong>Por paso de mensajes (por ejemplo, MPI).</strong> Como cada nodo tiene su memoria local y no existe un espacio de direcciones global, los datos se intercambian con operaciones Send/Receive o colectivas (Bcast, Scatter, Gather, Reduce) a través de la red de interconexión.</p></details></div         function calcAmdahl() {
            const f = document.getElementById('ua-f').value / 100;
            const p = Math.pow(2, +document.getElementById('ua-p').value);
            const S = 1 / ((1 - f) + f / p);
            const M = f < 1 ? 1 / (1 - f) : Infinity;
            document.getElementById('ua-fv').textContent = Math.round(f * 100) + ' %';
            document.getElementById('ua-pv').textContent = p.toLocaleString('es-MX');
            document.getElementById('ua-S').textContent = S.toFixed(2) + '×';
            document.getElementById('ua-E').textContent = Math.round(S / p * 100) + ' %';
            document.getElementById('ua-M').textContent = isFinite(M) ? M.toFixed(M < 100 ? 1 : 0) + '×' : '∞';
            document.getElementById('ua-bar').style.width = (isFinite(M) ? S / M * 100 : Math.min(100, S / p * 100)) + '%';
        }

        function construirIndice() {
            const cont = document.getElementById('tema-contenido');
            const titulos = cont.querySelectorAll('h2[id], h3[id], h4[id]');
            if (!titulos.length) return;
            let html = '<details open><summary><i class="fa-solid fa-list-ul"></i> Contenido de la unidad</summary><ul>';
            titulos.forEach(h => {
                const nivel = h.tagName.toLowerCase();
                html += '<li class="toc-' + nivel + '"><a href="#' + h.id + '">' + h.textContent + '</a></li>';
            });
            html += '</ul></details>';
            const toc = document.getElementById('tema-toc');
            toc.innerHTML = html;
            toc.style.display = 'block';
        }

        function irASeccion() {
            const id = decodeURIComponent(window.location.hash.replace('#', ''));
            if (!id) return;
            const el = document.getElementById(id);
            if (!el) return;
            setTimeout(() => {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                el.classList.add('resaltado');
                setTimeout(() => el.classList.remove('resaltado'), 2200);
            }, 150);
        }

        const params = new URLSearchParams(window.location.search);
        const tema = params.get('tema');

        if (temas[tema]) {
            document.getElementById('tema-titulo').textContent = temas[tema].titulo;
            document.getElementById('tema-descripcion').textContent = temas[tema].descripcion;
            document.getElementById('tema-contenido').innerHTML = temas[tema].contenido;
            construirIndice();
            irASeccion();
            if (tema === 'tema4') calcAmdahl();
        } else {
            document.getElementById('tema-titulo').textContent = "Tema no encontrado";
            document.getElementById('tema-descripcion').textContent = "No existe información para este tema.";
            document.getElementById('tema-contenido').innerHTML = "<p>Regresa al índice para elegir otro tema.</p>";
        }
    </script>
