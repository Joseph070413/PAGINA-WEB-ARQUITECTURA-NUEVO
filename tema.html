<h2 id="s-1-1">1.1 Modelos de arquitecturas de cómputo</h2>
<p>Las arquitecturas de cómputo son la forma en que se organizan y relacionan los componentes de una computadora para procesar información.</p>

<div class="info-grid">
    <div class="info-card">
        <h5>Arquitecturas clásicas</h5>
        <ul>
            <li>Utilizan principalmente un procesador.</li>
            <li>Las instrucciones se ejecutan de manera secuencial.</li>
            <li>Son sencillas y fueron la base de muchas computadoras actuales.</li>
        </ul>
    </div>
    <div class="info-card">
        <h5>Arquitecturas segmentadas</h5>
        <ul>
            <li>Dividen la ejecución de instrucciones en varias etapas.</li>

        </ul>
    </div>

            <li>Utilizan dos o más procesadores.</li>
            <li>Permiten realizar varias tareas simultáneamente.</li>
            <li>Mejoran el rendimiento cuando se necesitan ejecutar muchos procesos.</li>
        </ul>
    </div>
</div>

<!-- ===================== 1.1.1 ===================== -->
<h3 id="s-1-1-1">1.1.1 Arquitecturas clásicas</h3>
<p>Las arquitecturas clásicas corresponden a los modelos tradicionales utilizados para organizar los principales componentes de una computadora.</p>
<p>Entre las más representativas se encuentran:</p>

<h5>Arquitectura de Von Neumann</h5>
<p>Fue propuesta por John von Neumann y se caracteriza porque los datos y las instrucciones se almacenan en una misma memoria.</p>
<p><strong>Sus principales componentes son:</strong></p>
<ul>
    <li>Unidad Central de Procesamiento (CPU)</li>
    <li>Memoria</li>
    <li>Dispositivos de entrada</li>
    <li>Dispositivos de salida</li>
    <li>Buses de comunicación</li>
</ul>
<p><strong>Funcionamiento.</strong> El procesador realiza principalmente tres etapas:</p>
<ol>
    <li><strong>Búsqueda:</strong> obtiene la instrucción de la memoria.</li>
    <li><strong>Decodificación:</strong> interpreta la instrucción.</li>
    <li><strong>Ejecución:</strong> realiza la operación indicada.</li>
</ol>
<div class="pros-cons">
    <div class="pro"><h6>Ventaja</h6><p>Presenta una estructura sencilla y flexible.</p></div>
    <div class="contra"><h6>Desventaja</h6><p>El acceso compartido entre datos e instrucciones puede generar un cuello de botella, limitando el rendimiento.</p></div>
</div>

<h5>Arquitectura Harvard</h5>
<p>La arquitectura Harvard se diferencia de Von Neumann porque utiliza memorias independientes para las instrucciones y los datos. Esto permite que el procesador pueda acceder a ambos de manera independiente.</p>
<p><strong>Características</strong></p>
<ul>
    <li>Memoria para instrucciones.</li>
    <li>Memoria para datos.</li>
    <li>Buses independientes.</li>
    <li>Permite realizar accesos simultáneos.</li>
</ul>
<div class="pros-cons">
    <div class="pro"><h6>Ventaja</h6><p>Puede mejorar el rendimiento al permitir el acceso independiente a instrucciones y datos.</p></div>
    <div class="contra"><h6>Desventaja</h6><p>Su diseño y administración son más complejos.</p></div>
</div>

<h5>Información adicional: Von Neumann vs Harvard</h5><div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Aspecto</th><th>Von Neumann</th><th>Harvard</th></tr></thead><tbody><tr><td>Memoria</td><td>Una sola para datos e instrucciones</td><td>Dos memorias separadas</td></tr><tr><td>Buses</td><td>Un solo conjunto de buses</td><td>Buses independientes para datos e instrucciones</td></tr><tr><td>Acceso</td><td>Datos e instrucciones no pueden leerse a la vez</td><td>Lectura simultánea de ambos</td></tr><tr><td>Uso típico</td><td>PC, servidores, laptops</td><td>Microcontroladores (PIC, AVR) y DSP</td></tr><tr><td>Nota</td><td>Permite programas que se modifican a sí mismos</td><td>Los CPU modernos usan una <strong>Harvard modificada</strong>: caché L1 separada de datos e instrucciones y memoria principal unificada</td></tr></tbody></table></div>
<p>El <strong>cuello de botella de Von Neumann</strong> es la diferencia de velocidad entre CPU y memoria. Se mitiga con cachés, buses más anchos y la predicción de saltos.</p>

<!-- ===================== 1.1.2 ===================== -->
<h3 id="s-1-1-2">1.1.2 Arquitecturas segmentadas</h3>
<p>La arquitectura segmentada, también conocida como <strong>pipeline</strong>, divide la ejecución de una instrucción en diferentes etapas.</p>
<p>Mientras una instrucción se encuentra en una etapa, otra puede estar siendo procesada en una etapa diferente.</p>

<h5>Etapas comunes</h5>
<p>Un procesador puede utilizar etapas como:</p>
<ol>
    <li><strong>Fetch:</strong> búsqueda de la instrucción.</li>
    <li><strong>Decode:</strong> decodificación de la instrucción.</li>
    <li><strong>Execute:</strong> ejecución de la operación.</li>
    <li><strong>Memory:</strong> acceso a memoria.</li>
    <li><strong>Write Back:</strong> almacenamiento del resultado.</li>
</ol>

<h5>Objetivo</h5>
<p>El propósito principal de la segmentación es incrementar el rendimiento del procesador, permitiendo procesar varias instrucciones de manera parcialmente simultánea.</p>

<div class="pros-cons">
    <div class="pro">
        <h6>Ventajas</h6>
        <ul>
            <li>Mayor rendimiento.</li>
            <li>Mejor aprovechamiento de los recursos del procesador.</li>
            <li>Permite procesar varias instrucciones simultáneamente en diferentes etapas.</li>
        </ul>
    </div>
    <div class="contra">
        <h6>Desventajas</h6>
        <ul>
            <li>Mayor complejidad del diseño.</li>
            <li>Pueden presentarse conflictos entre instrucciones, conocidos como riesgos del pipeline.</li>
        </ul>
    </div>
</div>

<h5>Información adicional: Pipeline y rendimiento</h5><p>Con k etapas y n instrucciones, sin segmentación el tiempo es <strong>n·k</strong> ciclos; con segmentación ideal es <strong>k + (n − 1)</strong> ciclos.</p><div class="formula">Aceleración = (n·k) / (k + n − 1) → k cuando n es muy grande</div><p><strong>Ejemplo:</strong> 5 etapas y 100 instrucciones: 500 ciclos sin pipeline contra 104 con pipeline, una aceleración de ≈4.8.</p><h5>Riesgos (hazards) del pipeline</h5><ul><li><strong>Estructurales:</strong> dos instrucciones necesitan el mismo recurso a la vez (por ejemplo, la memoria). Se resuelven duplicando recursos.</li><li><strong>De datos:</strong> una instrucción necesita un resultado que otra aún no escribe (RAW). Se resuelven con adelantamiento (forwarding) o burbujas (stalls).</li><li><strong>De control:</strong> los saltos condicionales cambian el flujo. Se resuelven con predicción de saltos.</li></ul>

<!-- ===================== 1.1.3 ===================== -->
<h3 id="s-1-1-3">1.1.3 Arquitecturas de multiprocesamiento</h3>
<p>El multiprocesamiento consiste en utilizar dos o más procesadores o unidades de procesamiento dentro de un sistema para realizar tareas de manera simultánea o paralela.</p>

<h5>Características</h5>
<ul>
    <li>Utiliza múltiples unidades de procesamiento.</li>
    <li>Permite ejecutar diferentes tareas al mismo tiempo.</li>
    <li>Mejora la capacidad de procesamiento.</li>
    <li>Puede aumentar el rendimiento general del sistema.</li>
</ul>

<div class="pros-cons">
    <div class="pro">
        <h6>Ventajas</h6>
        <ul>
            <li>Mayor capacidad de procesamiento.</li>
            <li>Ejecución paralela de tareas.</li>
            <li>Mejor rendimiento en aplicaciones que pueden dividirse en procesos independientes.</li>
            <li>Mayor disponibilidad del sistema en determinadas configuraciones.</li>
        </ul>
    </div>
    <div class="contra">
        <h6>Desventajas</h6>
        <ul>
            <li>Mayor costo.</li>
            <li>Mayor complejidad de diseño y administración.</li>
            <li>No todas las aplicaciones pueden aprovechar de manera eficiente varios procesadores.</li>
        </ul>
    </div>
</div>

<h5>Información adicional: Taxonomía de Flynn (multiprocesamiento)</h5><div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Clase</th><th>Significado</th><th>Ejemplo</th></tr></thead><tbody><tr><td>SISD</td><td>Un flujo de instrucciones, un flujo de datos</td><td>CPU de un solo núcleo</td></tr><tr><td>SIMD</td><td>Una instrucción sobre varios datos</td><td>GPU, instrucciones vectoriales (SSE, AVX)</td></tr><tr><td>MISD</td><td>Varias instrucciones sobre un mismo dato</td><td>Muy raro; sistemas tolerantes a fallas</td></tr><tr><td>MIMD</td><td>Varias instrucciones y varios datos</td><td>CPU multinúcleo, clústeres</td></tr></tbody></table></div>
<h5>SMP vs clúster</h5><ul><li><strong>SMP</strong> (multiprocesamiento simétrico): varios procesadores comparten memoria y sistema operativo.</li><li><strong>Clúster:</strong> computadoras independientes conectadas por red que trabajan como un solo sistema.</li></ul>

<!-- ===================== 1.2 ===================== -->
<h2 id="s-1-2">1.2 Análisis de los componentes</h2>
<p>Una computadora está formada por diferentes componentes que trabajan juntos para procesar información.</p>
<p>Los principales componentes que estudiaremos son:</p>

<div class="info-grid">
    <div class="info-card"><span class="etiqueta">Procesamiento</span><h5>CPU</h5><p>Se encarga de ejecutar instrucciones.</p></div>
    <div class="info-card"><span class="etiqueta">Operaciones</span><h5>ALU</h5><p>Realiza operaciones aritméticas y lógicas.</p></div>
    <div class="info-card"><span class="etiqueta">Almacenamiento temporal</span><h5>Registros</h5><p>Guardan temporalmente información que está utilizando la CPU.</p></div>
    <div class="info-card"><span class="etiqueta">Comunicación</span><h5>Buses</h5><p>Transportan datos, direcciones y señales de control.</p></div>
    <div class="info-card"><span class="etiqueta">Almacenamiento</span><h5>Memoria</h5><p>Almacena programas y datos.</p></div>
    <div class="info-card"><span class="etiqueta">Periféricos</span><h5>Entrada/Salida</h5><p>Permite comunicarse con dispositivos externos.</p></div>
</div>

<h5>Información adicional: Cuatro ideas clave</h5><ul><li><strong>Programa almacenado:</strong> las instrucciones se guardan en memoria como datos y la CPU las ejecuta una tras otra.</li><li><strong>Contador de programa (PC):</strong> apunta a la siguiente instrucción por ejecutar.</li><li><strong>Bus de direcciones</strong> (dónde), <strong>bus de datos</strong> (qué) y <strong>bus de control</strong> (cómo y cuándo).</li><li>La capacidad de memoria direccionable es <strong>2ⁿ</strong> posiciones, donde n es el ancho del bus de direcciones. Con 32 bits: 4 GB.</li></ul>

<!-- ===================== 1.2.1 ===================== -->
<h3 id="s-1-2-1">1.2.1 Arquitecturas</h3>
<p>Una arquitectura define la forma en que se organizan los componentes de una computadora y cómo se comunican entre sí.</p>
<p>Una de las arquitecturas fundamentales estudiadas es la arquitectura de Von Neumann.</p>
<p><strong>Sus elementos básicos incluyen:</strong></p>
<ul>
    <li>Unidad de procesamiento.</li>
    <li>Memoria.</li>
    <li>Entrada/salida.</li>
    <li>Buses o canales de comunicación.</li>
</ul>
<p>Una característica fundamental de Von Neumann es el concepto de <strong>programa almacenado</strong>, donde las instrucciones y los datos pueden encontrarse en la memoria.</p>

<!-- ===================== 1.2.1.1 ===================== -->
<h4 id="s-1-2-1-1">1.2.1.1 Unidad Central de Procesamiento (CPU)</h4>
<p class="cita">"El cerebro de la computadora"</p>
<p>La CPU, por sus siglas en inglés <em>Central Processing Unit</em>, es el componente encargado de ejecutar las instrucciones de los programas y procesar los datos.</p>
<figure class="fig fig-chica">
    <img src="imagenes/p18_19.png" alt="Esquema de un chip de CPU">
    <figcaption>Esquema de una CPU.</figcaption>
</figure>

<p><strong>Entre las principales funciones de la CPU están:</strong></p>
<ol>
    <li><strong>Ejecutar instrucciones.</strong> Interpreta y ejecuta las instrucciones de los programas.</li>
    <li><strong>Realizar operaciones.</strong> Procesa operaciones matemáticas y lógicas.</li>
    <li><strong>Controlar procesos.</strong> Coordina las actividades internas de la computadora.</li>
    <li><strong>Trabajar con memoria.</strong> Obtiene instrucciones y datos de la memoria.</li>
    <li><strong>Comunicarse con otros componentes.</strong> Utiliza buses para intercambiar información.</li>
</ol>
<p>La CPU ejecuta instrucciones mediante un proceso que incluye obtenerlas, interpretarlas y realizar la operación correspondiente.</p>

<p><strong>Entre los componentes fundamentales de una CPU encontramos:</strong></p>
<ul>
    <li><strong>Unidad de Control:</strong> coordina la ejecución de las instrucciones.</li>
    <li><strong>ALU:</strong> realiza operaciones aritméticas y lógicas.</li>
    <li><strong>Registros:</strong> almacenan información temporalmente.</li>
    <li><strong>Reloj:</strong> ayuda a sincronizar las operaciones del procesador.</li>
    <li><strong>Buses internos:</strong> permiten el intercambio de información entre las diferentes partes.</li>
</ul>
<p>La ALU, la unidad de control y los registros son elementos fundamentales del funcionamiento interno de la CPU.</p>
<figure class="fig fig-chica">
    <img src="imagenes/p19_21.png" alt="Componentes internos de la CPU: ALU, unidad de control, registros, reloj y buses">
    <figcaption>Componentes internos de la CPU: ALU, Control Unit, Registers, Clock y Bus.</figcaption>
</figure>

<h5>Ciclo de instrucción</h5>
<p>Una instrucción normalmente pasa por varias etapas:</p>
<ol>
    <li><strong>FETCH — Búsqueda:</strong> la CPU obtiene la instrucción de la memoria.</li>
    <li><strong>DECODE — Decodificación:</strong> la CPU interpreta qué significa la instrucción.</li>
    <li><strong>EXECUTE — Ejecución:</strong> se realiza la operación solicitada.</li>
    <li><strong>STORE — Almacenamiento:</strong> el resultado se guarda donde corresponda.</li>
</ol>
<figure class="fig">
    <img src="imagenes/p20_23.png" alt="Ciclo de instrucción: fetch, decode, execute y store entre la unidad de control, la ALU y la RAM">
    <figcaption>Ciclo de instrucción: fetch → decode → execute → store.</figcaption>
</figure>

<h5>Información adicional: Rendimiento de la CPU</h5><div class="formula">Tiempo de CPU = (Instrucciones × CPI) / Frecuencia</div><p>CPI = ciclos por instrucción. Para mejorar el rendimiento se puede reducir el número de instrucciones, bajar el CPI o subir la frecuencia.</p><p><strong>Ejemplo:</strong> 2×10⁹ instrucciones, CPI = 1.5 y 3 GHz dan 2×10⁹ × 1.5 / 3×10⁹ = <strong>1 segundo</strong>.</p><ul><li><strong>Frecuencia (GHz):</strong> ciclos de reloj por segundo.</li><li><strong>Núcleos e hilos:</strong> cada núcleo ejecuta instrucciones de forma independiente.</li><li><strong>MIPS y FLOPS:</strong> millones de instrucciones por segundo, y operaciones de punto flotante por segundo.</li></ul>

<!-- ===================== 1.2.1.2 ===================== -->
<h4 id="s-1-2-1-2">1.2.1.2 Unidad Aritmético-Lógica (ALU)</h4>
<p>La ALU (UAL) es la parte de la CPU encargada de realizar operaciones aritméticas y lógicas.</p>
<figure class="fig">
    <img src="imagenes/p22_26.png" alt="Chip con la leyenda ALU sobre una tarjeta electrónica">
    <figcaption>Unidad Aritmético-Lógica (ALU).</figcaption>
</figure>

<p><strong>La ALU puede realizar operaciones matemáticas como:</strong></p>
<ul class="sin-vineta">
    <li>➕ <strong>Suma</strong></li>
    <li>➖ <strong>Resta</strong></li>
    <li>✖️ <strong>Multiplicación</strong></li>
    <li>➗ <strong>División</strong></li>
</ul>
<p>Dependiendo de la arquitectura del procesador, pueden existir unidades especializadas para operaciones más complejas.</p>

<h5>Operaciones lógicas</h5>
<p>La ALU también realiza operaciones lógicas. Algunas son:</p>
<ul>
    <li><strong>AND:</strong> devuelve verdadero cuando las condiciones son verdaderas.</li>
    <li><strong>OR:</strong> devuelve verdadero cuando al menos una condición es verdadera.</li>
    <li><strong>NOT:</strong> invierte el valor lógico.</li>
    <li><strong>Comparaciones.</strong> Por ejemplo:
        <ul>
            <li>10 &gt; 5 → verdadero</li>
            <li>3 &gt; 8 → falso</li>
        </ul>
    </li>
</ul>

<h5>Información adicional: Banderas de la ALU</h5><p>Tras cada operación la ALU actualiza banderas en el registro de estado:</p><div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Bandera</th><th>Se activa cuando</th></tr></thead><tbody><tr><td>Z (cero)</td><td>El resultado es 0</td></tr><tr><td>N / S (signo)</td><td>El resultado es negativo</td></tr><tr><td>C (acarreo)</td><td>Hay acarreo en operaciones sin signo</td></tr><tr><td>V / O (desbordamiento)</td><td>El resultado excede el rango con signo</td></tr></tbody></table></div>
<p>Las instrucciones de salto condicional (JZ, JNZ, JC…) consultan estas banderas.</p>
<!-- ===================== 1.2.1.3 ===================== -->
<h4 id="s-1-2-1-3">1.2.1.3 Registros</h4>
<figure class="fig fig-chica">
    <img src="imagenes/p23_28.png" alt="Diagrama de la CPU con la unidad de control, el procesador, los registros y la lógica combinacional resaltando los registros">
    <figcaption>Ubicación de los registros dentro de la CPU.</figcaption>
</figure>
<p>Los registros son pequeñas áreas de almacenamiento de muy alta velocidad que se encuentran dentro del procesador.</p>
<p>Se utilizan para guardar temporalmente información que la CPU necesita durante la ejecución de instrucciones. Pueden almacenar:</p>
<ul>
    <li>Datos.</li>
    <li>Instrucciones.</li>
    <li>Direcciones.</li>
    <li>Resultados.</li>
    <li>Información de estado.</li>
</ul>
<p>Son mucho más pequeños que la memoria RAM, pero ofrecen un acceso extremadamente rápido.</p>

<h5>¿Por qué son importantes los registros?</h5>
<p>La CPU necesita trabajar rápidamente. Si tuviera que ir a la RAM cada vez que necesita un dato, el procesamiento sería menos eficiente. Por eso utiliza registros para mantener información que está utilizando en ese momento.</p>

<h5>Tipos de registros</h5>
<ol>
    <li><strong>Contador de Programa — PC.</strong> Contiene la dirección de la siguiente instrucción que debe ejecutarse.</li>
    <li><strong>Registro de Instrucciones — IR.</strong> Mantiene la instrucción que está siendo procesada.</li>
    <li><strong>Registros de propósito general.</strong> Se utilizan para almacenar datos y resultados temporales.</li>
    <li><strong>Registro de estado.</strong> Contiene información sobre determinadas condiciones producidas por las operaciones.</li>
    <li><strong>Registro de direcciones.</strong> Contiene una dirección de memoria que se utilizará durante una operación.</li>
</ol>

<h5>Información adicional: Tipos de registros</h5><div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Registro</th><th>Función</th></tr></thead><tbody><tr><td>PC / IP</td><td>Dirección de la siguiente instrucción</td></tr><tr><td>IR</td><td>Guarda la instrucción en ejecución</td></tr><tr><td>MAR</td><td>Dirección de memoria a leer o escribir</td></tr><tr><td>MDR / MBR</td><td>Dato que va o viene de la memoria</td></tr><tr><td>Acumulador</td><td>Almacena resultados de la ALU</td></tr><tr><td>SP</td><td>Cima de la pila</td></tr><tr><td>Registro de estado</td><td>Banderas y modo del procesador</td></tr></tbody></table></div>
<p>Los registros son la memoria <strong>más rápida y más pequeña</strong> del sistema, con acceso en menos de 1 ciclo de reloj.</p>
<!-- ===================== 1.2.1.4 ===================== -->
<h4 id="s-1-2-1-4">1.2.1.4 Buses</h4>
<figure class="fig">
    <img src="imagenes/p25_31.png" alt="Bus del sistema: bus de control, bus de dirección y bus de datos conectando CPU, memoria y entrada/salida">
    <figcaption>Bus del sistema: bus de control, bus de dirección y bus de datos conectando la CPU, la memoria y la entrada/salida.</figcaption>
</figure>
<p>Los buses son sistemas de comunicación que permiten transferir información entre diferentes componentes de la computadora.</p>
<p><strong>Conectan componentes como:</strong></p>
<ul>
    <li>CPU</li>
    <li>Memoria</li>
    <li>Entrada/salida</li>
    <li>Otros dispositivos</li>
</ul>
<p>Un bus puede transportar datos, direcciones y señales de control.</p>

<h5>Ejemplo: la CPU quiere leer un dato de la memoria</h5>
<ul class="sin-vineta">
    <li>🟢 <strong>Bus de direcciones:</strong> indica "Quiero el dato que está en esta dirección."</li>
    <li>🟠 <strong>Bus de control:</strong> indica "Quiero realizar una operación de lectura."</li>
    <li>🔵 <strong>Bus de datos:</strong> transporta "Aquí está el dato solicitado."</li>
</ul>

    <img src="imagenes/p26_34.png" alt="Buses de direcciones, datos y control conectados a entrada/salida, CPU y memoria principal">
    <figcaption>Bus de direcciones, bus de datos y bus de control.</figcaption>
</figure>

<p>Cuanto más cerca de la CPU, la memoria es más rápida, más cara y más pequeña. Funciona gracias al <strong>principio de localidad</strong>.</p>
<!-- ===================== 1.2.2 ===================== -->
<h3 id="s-1-2-2">1.2.2 Memoria</h3>
<p>La memoria de una computadora es el conjunto de componentes utilizados para almacenar datos, instrucciones y resultados que necesita el sistema.</p>
<p><strong>La memoria permite que la computadora pueda:</strong></p>
<ul>
    <li>Guardar información.</li>
    <li>Recuperar datos.</li>
    <li>Ejecutar programas.</li>
    <li>Procesar instrucciones.</li>
    <li>Mantener información temporalmente o de forma permanente.</li>
</ul>
<p>No toda la memoria funciona de la misma manera. Existen diferentes tipos dependiendo de:</p>
<ul>
    <li>Velocidad</li>
    <li>Capacidad</li>
    <li>Duración de la información</li>
    <li>Costo</li>
</ul>
<figure class="fig">
    <img src="imagenes/p28_37.png" alt="Pirámide de memoria: registros del procesador, memoria caché, memoria RAM y memoria virtual">
    <figcaption>Jerarquía de memoria: registros del procesador, memoria caché, memoria RAM y memoria virtual.</figcaption>
</figure>

<!-- ===================== 1.2.2.1 ===================== -->
<h4 id="s-1-2-2-1">1.2.2.1 Conceptos básicos del manejo de la memoria</h4>

<h5>¿Qué es el manejo de memoria?</h5>
<p>Es el conjunto de técnicas que utiliza el sistema operativo para administrar el espacio de memoria que necesitan los programas. Se encarga de asignar, controlar, proteger y liberar memoria.</p>

<h5>Administración de memoria</h5>
<ul>
    <li>Asigna espacio a los procesos.</li>
    <li>Lleva el control de qué espacio está ocupado y cuál está disponible.</li>
    <li>Libera memoria cuando un programa termina.</li>
    <li>Evita que un proceso interfiera con otro.</li>
</ul>

<h5>Memoria física y memoria lógica</h5>
<ul>
    <li><strong>Memoria física:</strong> espacio real disponible en el equipo.</li>
    <li><strong>Memoria lógica:</strong> espacio de direcciones que utiliza cada programa.</li>
</ul>

<h5>Memoria virtual</h5>
<ul>
    <li>Permite que un programa utilice un espacio de memoria mayor al disponible físicamente.</li>
    <li>Utiliza almacenamiento secundario como apoyo.</li>
    <li>Es más lenta que acceder directamente a la memoria física.</li>
</ul>

<h5>Asignación de memoria</h5>
<p>El sistema operativo decide cuánto espacio necesita cada proceso y se lo asigna.</p>

<h5>Liberación de memoria</h5>
<p>Cuando un proceso termina, el espacio utilizado se libera para que pueda ser utilizado nuevamente.</p>

<h5>Paginación</h5>
<ul>
    <li>Divide la memoria lógica en páginas de tamaño fijo.</li>
    <li>La memoria física se divide en marcos.</li>
    <li>Permite administrar la memoria de manera más eficiente.</li>
</ul>

<h5>Segmentación</h5>
<p>Divide un programa en partes lógicas, por ejemplo:</p>
<ul>
    <li>Código</li>
    <li>Datos</li>
    <li>Pila</li>
    <li>Heap</li>
</ul>
<p>Los segmentos pueden tener diferentes tamaños.</p>

<h5>Fragmentación</h5>
<p>Ocurre cuando parte de la memoria no puede aprovecharse eficientemente.</p>
<ul>
    <li><strong>Interna:</strong> espacio desperdiciado dentro de un bloque asignado.</li>
    <li><strong>Externa:</strong> espacios libres pequeños distribuidos entre bloques ocupados.</li>
</ul>

<h5>Protección de memoria</h5>
<p>Evita que un programa acceda o modifique indebidamente la memoria utilizada por otro programa o por el sistema operativo.</p>
<figure class="fig">
    <img src="imagenes/p29_40.png" alt="Pirámide de memoria: registros, caché, RAM y memoria virtual">
    <figcaption>Registros del procesador, memoria caché, memoria RAM y memoria virtual (memoria física y memoria virtual).</figcaption>
</figure>

<h5>Información adicional: Direccionamiento y localidad</h5><ul><li><strong>Localidad temporal:</strong> un dato usado recientemente probablemente se usará otra vez.</li><li><strong>Localidad espacial:</strong> se usarán datos cercanos al que se acaba de acceder.</li><li><strong>Memoria virtual:</strong> usa disco como extensión de RAM mediante paginación; la MMU traduce direcciones virtuales a físicas.</li><li><strong>Memoria volátil vs no volátil:</strong> RAM pierde datos sin energía; ROM, Flash y SSD no.</li></ul>

<!-- ===================== 1.2.2.2 ===================== -->
<h4 id="s-1-2-2-2">1.2.2.2 Memoria principal</h4>
<figure class="fig">
    <img src="imagenes/p30_43.png" alt="Módulos de memoria RAM instalados en una tarjeta madre">
    <figcaption>Módulos de memoria RAM en una tarjeta madre.</figcaption>
</figure>
<p>La memoria principal es la memoria que utiliza la computadora para guardar temporalmente los datos y programas que están siendo utilizados por el procesador.</p>
<p>La memoria principal está formada principalmente por la <strong>RAM</strong>.</p>

<h5>¿Para qué sirve?</h5>
<ul>
    <li>Guarda los programas que están en ejecución.</li>
    <li>Almacena temporalmente los datos que necesita el procesador.</li>
    <li>Permite que los programas funcionen de manera rápida.</li>
    <li>Su contenido se pierde cuando se apaga la computadora.</li>
</ul>

<h5>Características</h5>
<ul>
    <li>Guarda temporalmente datos y programas en uso.</li>
    <li>Es mucho más rápida que el almacenamiento permanente.</li>
    <li>Pierde la información al apagar el equipo.</li>
    <li>Puede encontrarse en capacidades como 4 GB, 8 GB, 16 GB, etc.</li>
</ul>

<h5>¿Cómo funciona?</h5>
<p class="flujo">Almacenamiento → RAM → CPU</p>
<p>El programa se carga desde el almacenamiento hacia la RAM, y posteriormente el procesador puede acceder a los datos que necesita.</p>
<figure class="fig">
    <img src="imagenes/p31_45.png" alt="Módulos de memoria RAM junto al procesador en una tarjeta madre">
    <figcaption>Memoria RAM junto al procesador.</figcaption>
</figure>

<h5>Información adicional: Memoria principal (RAM y ROM)</h5><div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th></th><th>SRAM</th><th>DRAM</th></tr></thead><tbody><tr><td>Celda</td><td>6 transistores (biestable)</td><td>1 transistor + 1 capacitor</td></tr><tr><td>Refresco</td><td>No lo necesita</td><td>Sí, cada pocos ms</td></tr><tr><td>Velocidad / costo</td><td>Más rápida y cara</td><td>Más lenta y barata</td></tr><tr><td>Uso</td><td>Caché</td><td>Memoria principal</td></tr></tbody></table></div>
<p>La ROM (ROM, PROM, EPROM, EEPROM, Flash) conserva el firmware o BIOS/UEFI.</p>
<!-- ===================== 1.2.2.3 ===================== -->
<h4 id="s-1-2-2-3">1.2.2.3 Memoria caché</h4>
<figure class="fig">
    <img src="imagenes/p32_47.png" alt="Memoria caché L1, L2 y L3 en un procesador con dos núcleos">
    <figcaption>Memoria caché: niveles L1 (datos e instrucciones), L2 y L3 compartida.</figcaption>
</figure>
<p>La memoria caché es una memoria muy rápida y de poca capacidad que se encuentra cerca del procesador. Su función es guardar temporalmente los datos e instrucciones que la CPU utiliza con mayor frecuencia.</p>

<h5>¿Para qué sirve?</h5>
<ul>
    <li>Acelera el procesamiento de información.</li>
    <li>Reduce el tiempo que la CPU espera para obtener datos.</li>
    <li>Evita acceder constantemente a la memoria RAM.</li>
    <li>Mejora el rendimiento del equipo.</li>
</ul>

<h5>Tipos de memoria caché</h5>
<ul>
    <li><strong>L1:</strong> es la más rápida y pequeña. Está dentro del procesador.</li>
    <li><strong>L2:</strong> tiene mayor capacidad que L1, pero es un poco más lenta.</li>
    <li><strong>L3:</strong> es más grande y generalmente es compartida entre varios núcleos.</li>
</ul>

<h5>¿Cómo funciona?</h5>
<p class="flujo">CPU → Caché → RAM → Almacenamiento</p>
<p>Cuando la CPU necesita un dato, primero busca en la caché.</p>
<ul>
    <li>Si encuentra el dato: acceso rápido (acierto de caché).</li>
    <li>Si no lo encuentra: debe buscarlo en la RAM, lo que tarda más.</li>
</ul>
<figure class="fig">
    <img src="imagenes/p33_49.png" alt="Flujo de datos entre CPU, caché y RAM">
    <figcaption>La CPU consulta primero la caché; si no encuentra el dato, lo busca en la RAM, lo guarda en la caché y lo envía a la CPU.</figcaption>
</figure>

<h5>Información adicional: Caché</h5><div class="formula">Tiempo medio de acceso = Tasa de aciertos × Tcaché + (1 − Tasa de aciertos) × Tmemoria</div><p><strong>Ejemplo:</strong> con 95 % de aciertos, caché de 2 ns y RAM de 60 ns: 0.95×2 + 0.05×60 = <strong>4.9 ns</strong>.</p><h5>Correspondencia (mapeo)</h5><ul><li><strong>Directa:</strong> cada bloque va a una sola línea. Es simple, pero puede tener conflictos.</li><li><strong>Totalmente asociativa:</strong> un bloque puede ir en cualquier línea. Es flexible, pero cara.</li><li><strong>Asociativa por conjuntos (n vías):</strong> equilibrio entre ambas; es la más usada.</li></ul>
<h5>Políticas</h5><ul><li><strong>Reemplazo:</strong> LRU, FIFO, aleatoria.</li><li><strong>Escritura:</strong> write-through (escribe a caché y memoria) y write-back (escribe a memoria solo al reemplazar).</li></ul>

<!-- ===================== 1.2.3 ===================== -->
<h3 id="s-1-2-3">1.2.3 Manejo de la entrada/salida</h3>

<h4 id="s-1-2-3-1">1.2.3.1 Módulos de entrada/salida</h4>
<p>Los módulos de entrada/salida (E/S) son componentes que permiten la comunicación entre el procesador y los dispositivos periféricos de una computadora, como el teclado, mouse, impresora, disco duro, monitor, etc.</p>
<figure class="fig fig-chica">
    <img src="imagenes/p35_52.png" alt="Periféricos de entrada y de salida conectados a la computadora">
    <figcaption>Periféricos de entrada (teclado, ratón, scanner, micrófono, cámara digital, video player) y de salida (monitor, impresora, filmadora, plotter), además de diskette y disco duro.</figcaption>
</figure>

<h5>Información adicional: Funciones del módulo de E/S</h5><ul><li>Control y temporización de los dispositivos.</li><li>Comunicación con la CPU y con el dispositivo.</li><li>Almacenamiento temporal (buffer) de datos.</li><li>Detección de errores.</li></ul>
<p>Los dispositivos se acceden con <strong>E/S mapeada en memoria</strong> (comparten el espacio de direcciones) o <strong>E/S aislada</strong> (espacio y instrucciones IN/OUT propias).</p>
<h4 id="s-1-2-3-2">1.2.3.2 Entrada/salida programada</h4>
<p>La E/S programada es una de las formas más sencillas de E/S, donde la CPU realiza todo el trabajo. Las instrucciones de E/S se escriben en programas informáticos, y cada transferencia de datos se inicia mediante una instrucción del programa. La CPU gestiona las transferencias de datos entre todos los dispositivos y la memoria.</p>
<p>En la E/S programada, la CPU controla todos los aspectos de la transferencia de datos, como iniciar las operaciones de E/S, supervisar continuamente el estado de los dispositivos, transferir datos entre dispositivos y registros, mover datos entre registros y memoria, y determinar cuándo finaliza la operación.</p>

<h5>Información adicional: Espera activa (polling)</h5><p>En la E/S programada la CPU consulta constantemente el estado del dispositivo (<em>polling</em>), por lo que desperdicia ciclos mientras espera. Es sencilla, pero ineficiente con dispositivos lentos.</p>
<h4 id="s-1-2-3-3">1.2.3.3 Entrada/salida mediante interrupciones</h4>
<p>Permite que un dispositivo avise a la CPU cuando necesita atención o cuando ha terminado una operación.</p>
<p>La CPU inicia una operación de E/S y puede continuar realizando otras tareas; cuando el dispositivo termina o necesita atención, envía una señal de interrupción al procesador, haciendo que este atienda temporalmente la solicitud. Así la CPU no entra en bucles de espera pasiva o sondeo (<em>polling</em>), permite atender eventos externos de manera casi inmediata y facilita que el sistema maneje varios dispositivos y procesos a la vez de forma ordenada.</p>
<figure class="fig">
    <img src="imagenes/p37_55.png" alt="Diagrama de E/S por interrupciones: programa principal y rutina de servicio">
    <figcaption>El programa inicia el periférico y sigue ejecutándose; cuando se activa la línea de interrupción, se ejecuta la rutina de servicio, que realiza la transferencia de datos, y después continúa el programa principal.</figcaption>
</figure>

<h5>Información adicional: Ventaja sobre polling</h5><p>Con interrupciones la CPU trabaja en otra tarea y el dispositivo avisa cuando está listo. Aun así, la CPU debe mover cada dato, por lo que no conviene para grandes volúmenes (para eso existe el DMA).</p>
<h4 id="s-1-2-3-4">1.2.3.4 Acceso directo a memoria</h4>
<p>Es una característica del hardware que permite a los dispositivos periféricos transferir datos directamente hacia y desde la memoria del sistema sin la intervención constante de la unidad central de procesamiento (CPU).</p>
<p>Muchos sistemas hardware utilizan DMA, incluyendo controladores de unidades de disco, tarjetas gráficas y tarjetas de sonido. DMA es una característica esencial en todos los ordenadores modernos, ya que permite a dispositivos de diferentes velocidades comunicarse sin someter a la CPU a una carga masiva de interrupciones.</p>
<p>Una transferencia DMA consiste principalmente en copiar un bloque de memoria de un dispositivo a otro. En lugar de que la CPU inicie la transferencia, la transferencia se lleva a cabo por el controlador DMA. Un ejemplo típico es mover un bloque de memoria desde una memoria externa a una interna más rápida.</p>
<p>Tal operación no ocupa al procesador y, por ende, éste puede efectuar otras tareas. Las transferencias DMA son esenciales para aumentar el rendimiento de aplicaciones que requieren muchos recursos.</p>
<figure class="fig">
    <img src="imagenes/p39_58.png" alt="Comparación entre E/S programada (PIO) y acceso directo a memoria (DMA)">
    <figcaption>PIO: los datos pasan por la CPU para llegar a la RAM. DMA: los datos van directamente a la RAM sin pasar por la CPU. (Fuente de la imagen: Computer Desktop Encyclopedia, 1998.)</figcaption>
</figure>

<h5>Información adicional: Pasos de una transferencia DMA</h5><ol><li>La CPU programa al controlador DMA: dirección en memoria, cantidad de datos y sentido.</li><li>El DMA solicita el control del bus (HOLD / BUSREQ).</li><li>La CPU lo concede (HLDA / BUSACK).</li><li>El DMA transfiere los datos directamente entre dispositivo y memoria.</li><li>Al terminar, avisa a la CPU con una interrupción.</li></ol><h5>Modos</h5><ul><li><strong>Ráfaga (burst):</strong> mantiene el bus hasta terminar.</li><li><strong>Robo de ciclo:</strong> toma el bus ciclo por ciclo.</li><li><strong>Transparente:</strong> usa el bus solo cuando la CPU no lo necesita.</li></ul>

<h3 id="s-1-2-4">1.2.4 Buses</h3>
<p>Los buses son canales de comunicación que permiten transportar información entre los diferentes componentes de una computadora, como el procesador, la memoria y los dispositivos de entrada y salida.</p>

<h4 id="s-1-2-4-1">1.2.4.1 Tipos de buses</h4>
<p>Los buses son caminos de comunicación que permiten intercambiar información entre los componentes de una computadora. Los principales son:</p>

<h5>🔹 Bus de datos</h5>
<ul>
    <li>Se encarga de transportar los datos entre el procesador, memoria y otros dispositivos.</li>
    <li>Su tamaño se mide en bits, por ejemplo, 8, 16, 32 o 64 bits.</li>
    <li>Mientras más bits pueda transportar, mayor cantidad de información puede manejar al mismo tiempo.</li>
</ul>

<h5>🔹 Bus de direcciones</h5>
<ul>
    <li>Indica dónde se encuentra la información que el procesador necesita leer o dónde debe almacenarla.</li>
    <li>Comunica al procesador con una posición específica de la memoria.</li>
    <li>Su tamaño determina la cantidad de memoria que puede direccionar.</li>
</ul>

<h5>🔹 Bus de control</h5>
<ul>
    <li>Transporta las señales de control que coordinan las operaciones de la computadora.</li>
    <li>Indica acciones como leer, escribir, activar dispositivos o solicitar interrupciones.</li>
    <li>Permite que los diferentes componentes trabajen de manera coordinada.</li>
</ul>

<h5>Información adicional: Arbitraje de bus</h5><ul><li><strong>Centralizado:</strong> un árbitro decide quién usa el bus (daisy chain, solicitud independiente).</li><li><strong>Distribuido:</strong> los dispositivos negocian entre sí.</li></ul>
<p>Se llama <strong>maestro</strong> al dispositivo que inicia la transferencia y <strong>esclavo</strong> al que responde.</p>
<h4 id="s-1-2-4-2">1.2.4.2 Estructura de los buses</h4>
<p>La estructura de un bus está formada por un conjunto de líneas o conductores que permiten transmitir información entre los componentes de la computadora.</p>
<ul>
    <li><strong>Líneas de datos:</strong> transportan la información que se está procesando.</li>
    <li><strong>Líneas de direcciones:</strong> transportan las direcciones que indican dónde se encuentra o dónde se guardará un dato.</li>
    <li><strong>Líneas de control:</strong> transportan señales que coordinan las operaciones.</li>
    <li><strong>Ancho del bus:</strong> es la cantidad de bits que puede transportar el bus al mismo tiempo. Por ejemplo, un bus de 32 bits puede transportar 32 bits de información simultáneamente.</li>
</ul>
<figure class="fig">
    <img src="imagenes/p45_65.png" alt="Bus de datos bidireccional conectando microprocesador, unidad de memoria y sistema de entrada y salida">
    <figcaption>Un bus de datos bidireccional conecta el microprocesador (ALU, UC y reloj), la unidad de memoria (ROM y RAM) y el sistema de entrada y salida hacia los periféricos.</figcaption>
</figure>

<h5>Información adicional: Ancho de banda</h5><div class="formula">Ancho de banda = Ancho del bus (bytes) × Frecuencia × Transferencias por ciclo</div><p><strong>Ejemplo:</strong> bus de 64 bits (8 bytes) a 200 MHz con 2 transferencias por ciclo: 8 × 200×10⁶ × 2 = <strong>3.2 GB/s</strong>.</p><p>Buses síncronos usan reloj común; los asíncronos usan señales de acuerdo (handshake). En los seriales (PCIe, USB, SATA) se usa uno o varios carriles punto a punto.</p>
<h4 id="s-1-2-4-3">1.2.4.3 Jerarquías de buses</h4>
<p>La jerarquía de buses es la forma en que se organizan los diferentes buses de una computadora según su velocidad, función y tipo de dispositivos que conectan.</p>
<ul>
    <li><strong>🔹 Bus principal:</strong> es el bus que conecta los componentes más importantes del sistema. Generalmente necesita trabajar a alta velocidad.</li>
    <li><strong>🔹 Bus de expansión:</strong> se utiliza para conectar dispositivos adicionales al sistema. Por ejemplo, tarjetas de sonido, red u otros dispositivos de expansión.</li>
    <li><strong>🔹 Bus de entrada/salida (E/S):</strong> permite la comunicación entre la computadora y los dispositivos periféricos. Algunos ejemplos son teclado, mouse, impresora, discos y dispositivos USB.</li>
</ul>
<figure class="fig">
    <img src="imagenes/p47_69.png" alt="Jerarquía de buses: bus local, bus del sistema y bus de expansión">
    <figcaption>Jerarquía: el procesador se conecta por el bus local a la caché/adaptador; el bus del sistema conecta la memoria principal y dispositivos como SCSI, Firewire, gráficos, video y LAN; el bus de expansión conecta FAX, módem y puerto serie.</figcaption>
</figure>
<h5>Bus por jerarquía: el bus estándar de E/S</h5>
<p>Este es un bus usado para conectar dispositivos de E/S de baja velocidad (ratón, módems, tarjetas de sonido).</p>
<figure class="fig fig-chica">
    <img src="imagenes/p47_68.png" alt="Bus estándar de E/S con los puertos de una tarjeta madre">
    <figcaption>Puertos del bus estándar de E/S en una tarjeta madre.</figcaption>
</figure>

<h5>Información adicional: Ejemplos de buses</h5><div class="tabla-wrap"><table class="tabla-u4"><thead><tr><th>Bus</th><th>Uso</th></tr></thead><tbody><tr><td>PCIe</td><td>Tarjetas gráficas, SSD NVMe, tarjetas de expansión</td></tr><tr><td>SATA</td><td>Discos duros y SSD</td></tr><tr><td>USB</td><td>Periféricos externos</td></tr><tr><td>I²C / SPI</td><td>Comunicación entre chips y sensores</td></tr><tr><td>DDR (bus de memoria)</td><td>CPU ↔ RAM</td></tr></tbody></table></div>
<p>Una jerarquía típica va del bus de memoria (más rápido), al bus de la tarjeta madre, y a buses de expansión (más lentos), conectados por puentes (bridges).</p>

<h3 id="s-1-2-5">1.2.5 Interrupciones</h3>
<p>Las interrupciones son señales que avisan al procesador de que necesita atender un evento o tarea. Esto permite que la CPU detenga temporalmente lo que está haciendo, atienda la solicitud y después continúe con su trabajo.</p>
<h5>🔹 Tipos de interrupciones</h5>
<ul>
    <li><strong>De hardware:</strong> son generadas por dispositivos físicos, como el teclado, mouse, disco o impresora.</li>
    <li><strong>De software:</strong> son generadas por un programa para solicitar un servicio al sistema.</li>
    <li><strong>Internas:</strong> ocurren debido a situaciones dentro del procesador, como errores o excepciones.</li>
</ul>
<h5>Información adicional: Ciclo de atención de una interrupción</h5><ol><li>El dispositivo activa la línea de interrupción (INT / IRQ).</li><li>La CPU termina la instrucción actual.</li><li>Guarda el contexto (PC y registro de estado) en la pila.</li><li>Consulta el <strong>vector de interrupciones</strong> para encontrar la rutina de servicio (ISR).</li><li>Ejecuta la ISR.</li><li>Restaura el contexto y regresa con IRET.</li></ol><ul><li><strong>Enmascarables:</strong> pueden ignorarse (INTR).</li><li><strong>No enmascarables (NMI):</strong> no pueden ignorarse; indican fallas críticas.</li><li><strong>Prioridades:</strong> si llegan varias, se atiende primero la de mayor prioridad (controlador PIC/APIC).</li><li><strong>Excepciones y trampas (traps):</strong> se producen por división entre cero, fallo de página o llamadas al sistema.</li></ul>

<h2 id="s-2-0">Estructura y funciones de la Unidad Central de Procesamiento</h2>
<p>En esta unidad se estudia cómo está organizada la CPU, cómo se estructuran sus registros, de qué manera ejecuta las instrucciones y qué procesadores reales sirven como caso de estudio.</p>

<!-- ===================== 2.1 ===================== -->
<h3 id="s-2-1">2.1 Organización del procesador</h3>
<p>El procesador, también conocido como <strong>CPU (Central Processing Unit)</strong>, es el componente encargado de interpretar y ejecutar las instrucciones de los programas.</p>
<p>Su función principal es coordinar las operaciones internas del sistema y procesar la información necesaria para el funcionamiento de la computadora. Para lograrlo, utiliza diferentes componentes internos como registros, buses y unidades de control que trabajan de manera sincronizada.</p>

<!-- ===================== 2.2 ===================== -->
<h3 id="s-2-2">2.2 Estructura de registros</h3>
<p>Los registros son pequeñas unidades de almacenamiento de alta velocidad ubicadas dentro de la CPU. Su función es guardar temporalmente datos, instrucciones y direcciones de memoria que serán utilizados durante la ejecución de programas.</p>
<p>Debido a su rapidez, permiten reducir accesos constantes a la memoria RAM y mejorar el rendimiento general del procesador.</p>

<h4 id="s-2-2-1">2.2.1 Registros visibles para el usuario</h4>
<p>Los registros visibles para el usuario son aquellos a los que el programador puede acceder directamente mediante instrucciones del software. Se utilizan principalmente para almacenar datos temporales, direcciones de memoria y resultados de operaciones durante la ejecución de programas.</p>
<figure class="fig fig-chica">
    <img src="imagenes/u2_memoria_lectura_escritura.png" alt="Lectura y escritura en memoria: registro de dirección, celda de memoria y registro de palabra">
    <figcaption>Lectura y escritura en memoria: el registro de dirección activa una celda de memoria y la información pasa por el registro de palabra.</figcaption>
</figure>

<h4 id="s-2-2-2">2.2.2 Registros de control y de estado</h4>
<p>Estos registros permiten supervisar y coordinar la ejecución de instrucciones:</p>
<ul>
    <li><strong>Contador de Programa (PC):</strong> dirección de la próxima instrucción.</li>
    <li><strong>Registro de Instrucción (IR):</strong> instrucción que se está ejecutando.</li>
    <li><strong>Registros de Estado/Flags:</strong> indican condiciones como cero, negativo, desbordamiento o acarreo.</li>
    <li><strong>Registro de Control.</strong></li>
</ul>
<figure class="fig">
    <img src="imagenes/u2_cpu_diagrama_bloques.png" alt="Diagrama de la CPU: unidad de control, procesador con registros y lógica combinacional, memoria principal, entrada y salida">

<!-- ===================== 2.3 ===================== -->
<h3 id="s-2-3">2.3 El ciclo de instrucción</h3>
<p>El ciclo de instrucción describe cómo la CPU procesa cada orden:</p>
<ol>
    <li><strong>Fetch (Captura):</strong> la CU obtiene la instrucción desde la memoria usando el PC.</li>
    <li><strong>Decode (Decodificación):</strong> el decodificador interpreta el código de operación.</li>
    <li><strong>Execute (Ejecución):</strong> la ALU realiza la operación indicada.</li>
    <li><strong>Memory Access (Acceso a memoria, si aplica):</strong> se leen o escriben datos en memoria.</li>
    <li><strong>Write Back (Escritura de resultado):</strong> el resultado se guarda en un registro o en memoria.</li>
</ol>
<figure class="fig">
    <img src="imagenes/u2_ciclo_instruccion.png" alt="Ciclo de instrucción: fetch desde la RAM, decode en la unidad de control, execute en la ALU y store">
    <figcaption>Ciclo de instrucción: fetch (RAM) → decode (unidad de control) → execute (unidad aritmético-lógica) → store.</figcaption>
</figure>

<h4 id="s-2-3-1">2.3.1 Ciclo Fetch-Decode-Execute</h4>
<p>La CPU sigue un ciclo básico para ejecutar instrucciones:</p>
<ul>
    <li><strong>Fetch (Captura):</strong> la unidad de control obtiene la instrucción desde la memoria principal (RAM) usando el contador de programa (PC).</li>
    <li><strong>Decode (Decodificación):</strong> la instrucción es interpretada por la unidad de control, que determina qué operación realizar y qué recursos usar.</li>
    <li><strong>Execute (Ejecución):</strong> la unidad aritmético-lógica (ALU) o la unidad de coma flotante ejecuta la operación, y los resultados se almacenan en registros o memoria.</li>
</ul>

<h4 id="s-2-3-2">2.3.2 Segmentación de instrucciones</h4>
<p>La segmentación permite que varias instrucciones se procesen en paralelo, dividiendo el ciclo en etapas:</p>
<ol>
    <li><strong>Etapa 1:</strong> Captura (Fetch).</li>
    <li><strong>Etapa 2:</strong> Decodificación.</li>
    <li><strong>Etapa 3:</strong> Ejecución.</li>
    <li><strong>Etapa 4:</strong> Acceso a memoria (si es necesario).</li>
    <li><strong>Etapa 5:</strong> Escritura de resultados.</li>
</ol>

<h4 id="s-2-3-3">2.3.3 Conjunto de instrucciones, características y funciones</h4>
<p>El <strong>ISA (Instruction Set Architecture)</strong> define las operaciones que la CPU puede ejecutar. Sus características principales son:</p>
<ul>
    <li><strong>Tipos de instrucciones:</strong> aritméticas, lógicas, de control de flujo, de acceso a memoria, de entrada/salida.</li>
    <li><strong>Modos de direccionamiento:</strong> cómo se accede a los datos (directo, indirecto, inmediato, por registro).</li>
    <li><strong>Tamaño de palabra:</strong> número de bits que la CPU procesa (32, 64 bits).</li>
</ul>
<h5>Funciones clave</h5>
<ul>
    <li>Ejecutar operaciones matemáticas y lógicas.</li>
    <li>Controlar el flujo de programas (saltos, bucles).</li>
    <li>Gestionar la comunicación con memoria y periféricos.</li>
    <li>Coordinar procesos mediante interrupciones.</li>
</ul>

<h4 id="s-2-3-4">2.3.4 Modos de direccionamiento</h4>
<p>Son la forma en la que una instrucción le indica al procesador dónde se encuentra el operando que debe utilizar. Se dividen en 8 modos de direccionamiento:</p>

<div class="info-grid">
    <div class="info-card">
        <h5>1. Direccionamiento inmediato</h5>
        <p>El dato está directamente dentro de la instrucción. Ejemplo:</p>
        <p><span class="flujo">MOV R1, #10</span></p>
    </div>
    <div class="info-card">
        <h5>2. Directo o absoluto</h5>
        <p>La instrucción contiene la dirección de memoria donde se encuentra el dato. Ejemplo:</p>
        <p><span class="flujo">MOV R1, [1000]</span></p>
    </div>
    <div class="info-card">
        <h5>3. Indirecto</h5>
        <p>La dirección indicada por la instrucción no contiene directamente el dato, sino otra dirección que apunta al dato.</p>
    </div>
    <div class="info-card">
        <h5>4. Mediante registro</h5>
        <p>El dato se encuentra en un registro de la CPU. Ejemplo:</p>
        <p><span class="flujo">ADD R1, R2</span></p>
    </div>
    <div class="info-card">
        <h5>5. Indirecto mediante registro</h5>
        <p>El registro contiene una dirección de memoria, no el dato directamente. Ejemplo:</p>
        <p><span class="flujo">MOV R1, [R2]</span></p>
    </div>
    <div class="info-card">
        <h5>6. Indexado</h5>
        <p>La dirección efectiva se obtiene sumando una dirección base y un índice:</p>
        <p><span class="flujo">Dirección efectiva = Dirección base + Índice</span></p>
        <p>Ejemplo: con DB = 1000 e índice 20, DE = 1000 + 20 = 1020. Es especialmente útil para trabajar con arreglos.</p>
    </div>
    <div class="info-card">
        <h5>7. Basado en registro</h5>
        <p>Es parecido al indexado, pero se utiliza un registro como base. Ejemplo: registro base = 1000 y desplazamiento = 20, entonces DE = 1000 + 20 = 1020.</p>
        <p>Es muy utilizado para acceder a estructuras de datos, variables locales y datos almacenados en memoria.</p>
    </div>
    <div class="info-card">
        <h5>8. Relativo</h5>
        <p>La dirección se obtiene utilizando la dirección actual de ejecución y un desplazamiento:</p>
        <p><span class="flujo">Dirección efectiva = PC + desplazamiento</span></p>
        <p>Donde PC es el Program Counter (contador de programa), que contiene la dirección de la siguiente instrucción que debe ejecutarse.</p>
    </div>
</div>

<h2 id="s-3-0">Arquitectura de computadoras</h2>
<p>En esta unidad se estudian los componentes que conforman una computadora completa: el chip set y los controladores que organizan la comunicación entre la CPU, la memoria y los periféricos, así como sus aplicaciones y los ambientes de servicio donde se utilizan.</p>

<!-- ===================== 3.1 ===================== -->
<h3 id="s-3-1">3.1 Chip set</h3>
<p>El chipset es el centro de comunicaciones de la placa base de un ordenador, ese que controla y organiza los datos entre el procesador y el resto de componentes, como los discos duros, los discos SSD, la memoria RAM, las tarjetas gráficas, los puertos USB, el monitor, el teclado o el ratón. Puedes imaginarlo como un controlador de tráfico: organiza, prioriza y encamina los datos para que nada choque y todo llegue a tiempo.</p>
<p>Más allá de mover datos, el chipset determina compatibilidades: si una CPU o una memoria no pueden hablar «el mismo idioma» con el chipset, no habrá comunicación posible, por lo que esas piezas no funcionarán o lo harán con limitaciones.</p>
<p>Tampoco hay que confundir el chipset con la CPU. La CPU ejecuta instrucciones y realiza cálculos; el chipset, en cambio, coordina las comunicaciones y las E/S entre los distintos dispositivos, incluida la propia CPU. Si la CPU es el cerebro, el chipset sería el sistema nervioso que distribuye señales por todo el sistema.</p>
<p class="nota">Analogía: CPU = cerebro · Chipset = sistema nervioso / controlador de tráfico.</p>
<figure class="fig fig-chica"><img src="imagenes/u3_chipset_placa.png" alt="Placa base con un procesador instalado en su zócalo LGA775"><figcaption>Placa base: el chipset organiza la comunicación entre el procesador y el resto de componentes.</figcaption></figure>

<!-- ===================== 3.1.1 ===================== -->
<h4 id="s-3-1-1">3.1.1 Unidad Central de Procesamiento (CPU)</h4>
<p>La CPU no se conecta directamente a la mayoría de los componentes, sino que utiliza el chipset como puente de comunicación.</p>
<div class="info-grid">
    <div class="info-card">
        <h5>Función</h5>
        <p>Procesa las instrucciones y se apoya en el chipset para enviar y recibir datos hacia/desde la memoria y los periféricos.</p>
    </div>
    <div class="info-card">
        <h5>Evolución</h5>
        <ul>
            <li><strong>Tradicional:</strong> la CPU se comunicaba con la RAM y video, este a su vez con los periféricos y el disco.</li>
            <li><strong>Moderna:</strong> la CPU ya integra el controlador de memoria y líneas PCIe principales; se conecta al chipset (PCH/FCH) mediante un enlace punto a punto de alta velocidad para manejar la Entrada/Salida.</li>
        </ul>
    </div>
    <div class="info-card">
        <h5>Coordinación</h5>
        <p>Recibe las señales de reloj del chipset y envía las direcciones de memoria y control para que este las rutee al destino correcto.</p>
    </div>
</div>
<figure class="fig fig-chica"><img src="imagenes/u3_cpu_amd_chip.png" alt="Procesador AMD sobre una placa base"><figcaption>Procesador AMD montado en la placa.</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3_chipset_z77.png" alt="Procesador Intel y chipset Intel Z77"><figcaption>Procesador Intel junto a un chipset Intel Z77.</figcaption></figure>

<h5>1. Componentes internos de la CPU</h5>
<p>Para entender cómo procesa las instrucciones, es clave mencionar sus tres unidades principales:</p>
<ul>
    <li><strong>Unidad de Control (CU):</strong> coordina y dirige las operaciones de todo el sistema; busca las instrucciones en la memoria, las decodifica y envía señales de control a los demás componentes.</li>
    <li><strong>Unidad Aritmético-Lógica (ALU):</strong> realiza las operaciones matemáticas (sumas, restas) y lógicas (comparaciones AND, OR, NOT).</li>
    <li><strong>Registros de memoria:</strong> pequeños espacios de almacenamiento ultrarrápidos dentro del propio chip para guardar datos e instrucciones temporales en uso inmediato.</li>
</ul>

<h5>2. Niveles de memoria caché (L1, L2, L3)</h5>
<p>La CPU requiere acceso ultrarrápido a los datos para no quedar en espera de la memoria RAM:</p>
<div class="info-grid">
    <div class="info-card"><h5>Caché L1</h5><p>La más rápida y de menor tamaño, ubicada dentro de cada núcleo.</p></div>
    <div class="info-card"><h5>Caché L2</h5><p>Ligeramente más lenta que la L1 pero de mayor capacidad; actúa como respaldo secundario de cada núcleo.</p></div>
    <div class="info-card"><h5>Caché L3</h5><p>Memoria compartida entre todos los núcleos del procesador, encargada de acelerar la comunicación entre ellos y reducir las peticiones directas a la RAM.</p></div>
</div>


<h5>3. Evolución de la arquitectura: chipset tradicional vs. moderno</h5>
<div class="info-grid">
    <div class="info-card">
        <h5>Esquema tradicional (Northbridge / Southbridge)</h5>
        <ul>
            <li><strong>Northbridge (puente norte):</strong> conectaba directamente la CPU con la memoria RAM y la tarjeta de video (PCIe/AGP) por su alta velocidad.</li>
            <li><strong>Southbridge (puente sur):</strong> gestionaba los periféricos lentos (discos duros, USB, audio, red, BIOS) y se comunicaba con la CPU a través del Northbridge.</li>
        </ul>
    </div>
    <div class="info-card">
        <h5>Esquema moderno (System Agent / SoC)</h5>
        <ul>
            <li>El puente norte desaparece al integrarse directamente en el die o empaque de la CPU (controlador de memoria DDR y líneas PCIe de alta velocidad).</li>
            <li>El puente sur evoluciona al PCH o FCH, conectado a la CPU por enlaces punto a punto de alta velocidad (como DMI o UMI).</li>
        </ul>
    </div>
</div>
<figure class="fig fig-chica"><img src="imagenes/u3_northbridge_southbridge.png" alt="Esquema del Northbridge y Southbridge conectados a CPU, RAM, video y periféricos"><figcaption>Esquema tradicional: el Northbridge conecta CPU, RAM y video; el Southbridge gestiona los periféricos lentos.</figcaption></figure>

<h5>4. Conceptos clave de rendimiento</h5>
<ul>
    <li><strong>Núcleos e hilos (cores &amp; threads):</strong>
        <ul>
            <li><strong>Núcleo físico:</strong> unidad de procesamiento independiente dentro de la CPU.</li>
            <li><strong>Multihilo (Hyper-Threading / SMT):</strong> tecnología que permite a un solo núcleo físico ejecutar dos hilos de procesamiento simultáneamente.</li>
        </ul>
    </li>
    <li><strong>Frecuencia de reloj (GHz):</strong> determina la cantidad de ciclos de reloj que la CPU puede realizar por segundo.</li>
    <li><strong>IPC (Instrucciones Por Ciclo):</strong> mide la eficiencia de la arquitectura de la CPU independientemente de los GHz.</li>
</ul>

<!-- ===================== 3.1.2 ===================== -->
<h4 id="s-3-1-2">3.1.2 Controlador de bus</h4>
<h5>¿Qué es y qué hace?</h5>
<p>Un <strong>bus</strong> es el camino por donde viajan los datos entre los componentes. El <strong>controlador de bus</strong> es el que organiza todo ese tráfico.</p>
<h5>Funciones principales</h5>
<ul>
    <li><strong>Arbitraje:</strong> decide qué dispositivo usa el bus cuando varios lo piden al mismo tiempo.</li>
    <li><strong>Control de acceso:</strong> da permiso o lo niega, para que no haya choques de datos.</li>
    <li><strong>Sincronización:</strong> hace que dispositivos de distinta velocidad se entiendan.</li>
    <li><strong>Traducción entre buses:</strong> conecta buses de diferente ancho o velocidad (por ejemplo, el bus de la memoria RAM con el de un puerto USB).</li>
    <li><strong>Manejo de señales de control:</strong> manda las órdenes de lectura, escritura y reloj.</li>
</ul>

<h5>Conceptos clave</h5>
<div class="info-grid">
    <div class="info-card"><h5>Maestro (bus master)</h5><p>El que manda y empieza la comunicación, por ejemplo la CPU.</p></div>
    <div class="info-card"><h5>Esclavo</h5><p>El que responde a lo que le piden, por ejemplo la memoria.</p></div>
    <div class="info-card">
        <h5>Métodos de arbitraje</h5>
        <ul>
            <li>En cadena (daisy chain).</li>
            <li>Por consulta (polling).</li>
            <li>Por petición independiente.</li>
        </ul>
    </div>
</div>
<figure class="fig"><img src="imagenes/u3_bus_elementos.png" alt="Elementos básicos de un sistema de cómputo: CPU, memoria, unidad de control y dispositivos de E/S unidos por un bus"><figcaption>Elementos básicos de un sistema de cómputo conectados por un bus.</figcaption></figure>

<h5>Tipos de bus, características y ejemplos</h5>
<p><strong>Los 3 buses del sistema:</strong></p>
<ol>
    <li><strong>Bus de datos:</strong> transporta la información. Va en dos sentidos (lee y escribe).</li>
    <li><strong>Bus de direcciones:</strong> dice en qué lugar de la memoria o de qué dispositivo se va a leer o escribir. Va en un solo sentido, del CPU hacia afuera.</li>
    <li><strong>Bus de control:</strong> manda las señales de coordinación (leer, escribir, reloj, interrupciones).</li>
</ol>
<p>El ancho del bus importa. Con un bus de direcciones de 32 bits se pueden direccionar 4 GB de memoria. Con 64 bits el límite es enorme.</p>
<p><span class="flujo">Ancho de banda = ancho del bus × frecuencia</span></p>
<p>Es la cantidad de datos que se mueven por segundo.</p>
<p><strong>Tipos según su forma de transmitir:</strong></p>
<ul>
    <li><strong>Paralelo:</strong> manda varios bits a la vez (el PCI antiguo).</li>
    <li><strong>Serie:</strong> manda bit por bit, pero a mucha velocidad (PCI Express, USB, SATA).</li>
</ul>
<figure class="fig"><img src="imagenes/u3_bus_datos_direccion_control.png" alt="Diagrama de bus de datos, bus de dirección y bus de control conectando CPU, memoria y unidad de E/S"><figcaption>Los tres buses del sistema: datos, dirección y control.</figcaption></figure>

<!-- ===================== 3.1.3 ===================== -->
<h4 id="s-3-1-3">3.1.3 Puertos y puertas de entrada/salida (E/S)</h4>
<p>Son las interfaces físicas y lógicas que permiten la transferencia de datos entre el procesador (CPU) / memoria y los dispositivos periféricos (teclado, disco duro, red).</p>
<p><strong>Función principal:</strong> actuar como puente y traducir la información entre el bus del sistema y los controladores de los periféricos.</p>
<h5>Tipos principales</h5>
<div class="info-grid">
    <div class="info-card"><h5>Serie</h5><p>Transmiten datos bit a bit (ej. USB, Ethernet).</p></div>
    <div class="info-card"><h5>Paralelo</h5><p>Transmiten múltiples bits simultáneamente (ej. bus de datos interno).</p></div>
    <div class="info-card"><h5>Mapeados en memoria (MMIO)</h5><p>Comparten el mismo espacio de direcciones que la RAM.</p></div>
    <div class="info-card"><h5>Mapeados en E/S (Isolated I/O)</h5><p>Utilizan un espacio de direcciones y líneas de control independientes.</p></div>
</div>

<!-- ===================== 3.1.4 ===================== -->
<h4 id="s-3-1-4">3.1.4 Controlador de interrupciones</h4>
<p>El controlador de interrupciones es un componente adicional que se utiliza para gestionar las peticiones de interrupciones. Cada módulo de entrada y salida tiene líneas de petición de interrupción y reconocimiento conectadas al controlador de interrupciones; de esta manera, el procesador solo debe tener una línea de petición de interrupción y una de reconocimiento conectadas al controlador de interrupciones para gestionar las peticiones de entrada y salida.</p>
<h5>Funciones del controlador de interrupciones</h5>
<ul>
    <li>Establecer una política de prioridades para los módulos de entrada y salida del controlador.</li>
    <li>Destacar qué módulo de entrada y salida necesita atención e informar al procesador.</li>
    <li>La gestión de interrupciones de este sistema es similar a la gestión de interrupciones con un solo módulo de entrada y salida, por lo que debe ajustar la etapa de reconocimiento de interrupciones para administrar las prioridades y determinar qué atención periférica necesita.</li>
</ul>
<figure class="fig"><img src="imagenes/u3_controlador_interrupciones.png" alt="Controlador de interrupciones conectado a varios módulos de E/S mediante líneas INT e INTA"><figcaption>Controlador de interrupciones: cada módulo de E/S tiene líneas de petición y reconocimiento conectadas al controlador.</figcaption></figure>

<!-- ===================== 3.1.5 ===================== -->
<h4 id="s-3-1-5">3.1.5 Controlador de acceso directo a memoria (DMA)</h4>
<p>Es un circuito integrado en la estructura del chipset que transfiere datos entre los periféricos y la memoria RAM sin pasar por la CPU. Permite que discos duros, redes o tarjetas de sonido muevan grandes bloques de datos directamente a la RAM.</p>
<h5>Proceso básico</h5>
<ol>
    <li>El periférico pide acceso al DMA.</li>
    <li>El DMA le solicita a la CPU liberar el bus de datos.</li>
    <li>La CPU cede el bus y el DMA realiza la transferencia directamente a la RAM.</li>
    <li>Al finalizar, el DMA envía una interrupción (IRQ) a la CPU para avisar que los datos están listos.</li>
</ol>
<div class="pros-cons">
    <div class="pro"><h6>Beneficio</h6><p>Evita que la CPU pierda tiempo copiando byte por byte, liberándola para ejecutar otros procesos.</p></div>
</div>
<figure class="fig fig-chica"><img src="imagenes/u3_dma_tarjeta.png" alt="Tarjeta con controlador DMA en formato PCIe"><figcaption>Ejemplo de tarjeta con circuito DMA.</figcaption></figure>

<!-- ===================== 3.1.6 ===================== -->
<h4 id="s-3-1-6">3.1.6 Circuitos de temporización</h4>
<p>Son los circuitos que generan el «reloj» de la computadora, la señal que marca el ritmo para que todo trabaje coordinado.</p>
<ul>
    <li>La señal de reloj es una onda cuadrada que sube y baja constantemente.</li>
    <li>Cada subida y bajada completa es un <strong>ciclo de reloj</strong>.</li>
    <li><strong>Frecuencia:</strong> cuántos ciclos hay por segundo. Se mide en Hertz (Hz).
        <ul>
            <li>1 MHz = un millón de ciclos por segundo.</li>
            <li>1 GHz = mil millones de ciclos por segundo.</li>
        </ul>
    </li>
    <li><strong>Periodo:</strong> lo que dura un ciclo. Ejemplo: a 1 GHz, cada ciclo dura 1 nanosegundo.</li>
</ul>
<h5>¿Para qué se necesita?</h5>
<ul>
    <li>El CPU ejecuta las instrucciones paso por paso (buscar, decodificar, ejecutar), y cada paso se marca con el reloj.</li>
    <li>Sincroniza al CPU, la memoria y los buses.</li>
    <li>Sin reloj no habría orden: cada componente iría a su propio ritmo.</li>
</ul>
<figure class="fig"><img src="imagenes/u3_senal_reloj.png" alt="Señal de reloj: onda cuadrada de periodo T entre 0 y 10 V"><figcaption>Señal de reloj: onda cuadrada con periodo T.</figcaption></figure>
<p class="nota">Más frecuencia normalmente significa más velocidad, pero también más calor y más consumo de energía.</p>

<!-- ===================== 3.1.7 ===================== -->
<h4 id="s-3-1-7">3.1.7 Circuitos de control</h4>
<p>Son los componentes electrónicos (controladores) encargados de gestionar, coordinar y sincronizar la transferencia de datos entre la CPU/memoria y los dispositivos periféricos.</p>
<p><strong>¿Qué hacen?</strong> Interpretan las órdenes de la CPU, gestionan las señales de reloj y verifican el estado del periférico (ocupado, listo, error) antes de transferir datos.</p>
<h5>Componentes clave</h5>
<ul>
    <li><strong>Registros de estado, control y datos:</strong> almacenan las órdenes, el estado actual y los datos en tránsito.</li>
    <li><strong>Lógica de decodificación:</strong> reconoce la dirección específica del dispositivo asignada por el sistema.</li>
</ul>
<h5>Mecanismos de operación</h5>
<div class="info-grid">
    <div class="info-card"><h5>E/S programada</h5><p>La CPU consulta constantemente si el circuito está listo (polling).</p></div>
    <div class="info-card"><h5>Interrupciones</h5><p>El circuito de control avisa a la CPU solo cuando necesita atención.</p></div>
    <div class="info-card"><h5>DMA</h5><p>El circuito transfiere bloques de datos directamente a la RAM sin saturar la CPU.</p></div>
</div>

<!-- ===================== 3.1.8 ===================== -->
<h4 id="s-3-1-8">3.1.8 Controles de video</h4>
<p>Los controles de video, también llamados controladores de video o adaptadores gráficos, son componentes encargados de procesar y enviar la información visual desde la computadora hacia un monitor o pantalla.</p>
<h5>Puntos clave</h5>
<ul>
    <li><strong>Función principal:</strong> convierten los datos digitales generados por la computadora en señales que pueden ser interpretadas por una pantalla.</li>
    <li><strong>Intermediario entre CPU y monitor:</strong> reciben instrucciones de la CPU y de la memoria, procesan las imágenes y controlan su presentación.</li>
    <li><strong>Memoria de video:</strong> utilizan una memoria propia, conocida como VRAM, para almacenar temporalmente:
        <ul>
            <li>Imágenes.</li>
            <li>Colores.</li>
            <li>Texturas.</li>
            <li>Cuadros o frames.</li>
            <li>Información de resolución.</li>
        </ul>
    </li>
    <li><strong>Procesador gráfico:</strong> muchos controladores incluyen una GPU, especializada en realizar cálculos gráficos de forma más rápida que la CPU.</li>
</ul>
<figure class="fig fig-chica"><img src="imagenes/u3_gpu_nvidia.png" alt="Chip GPU Nvidia sobre una tarjeta gráfica"><figcaption>Procesador gráfico (GPU) de una tarjeta de video.</figcaption></figure>

<!-- ===================== 3.2 ===================== -->
<h3 id="s-3-2">3.2 Aplicaciones</h3>
<p>El punto de Aplicaciones aborda cómo el hardware (procesadores, buses, memoria y periféricos) se diseña, selecciona y optimiza para atender tareas o entornos de cómputo específicos.</p>
<ul>
    <li><strong>Adecuación de hardware:</strong> evalúa la potencia de procesamiento, el ancho de banda y la capacidad de E/S necesarios según el tipo de software (por ejemplo, cómputo gráfico, procesamiento en tiempo real o bases de datos).</li>
    <li><strong>Integración sistema-periférico:</strong> analiza la relación entre los controladores del chipset, la memoria y las interfaces físicas (Entrada/Salida, Almacenamiento y Fuentes de Alimentación) para garantizar que el sistema opere con estabilidad y eficiencia.</li>
    <li>Las aplicaciones sirven de enlace entre las especificaciones técnicas de la arquitectura y las necesidades prácticas del usuario o la industria.</li>
</ul>
<figure class="fig fig-chica"><img src="imagenes/u3_aplicaciones.png" alt="Ilustración de dispositivos, nube, servidores y bases de datos interconectados"><figcaption>Aplicaciones: el hardware adaptado a las necesidades del usuario o la industria.</figcaption></figure>

<!-- ===================== 3.2.1 ===================== -->
<h4 id="s-3-2-1">3.2.1 Entrada / Salida</h4>
<p>Son todos los aparatos que le sirven a la computadora para recibir información (entrada) y para mostrarla o sacarla (salida).</p>
<h5>Ejemplos</h5>
<ul>
    <li><strong>Entrada:</strong> teclado, mouse, micrófono, cámara, escáner.</li>
    <li><strong>Salida:</strong> monitor, bocinas, impresora, proyector.</li>
    <li><strong>Entrada y salida a la vez:</strong> pantalla touch, USB, tarjeta de red, disco duro externo.</li>
</ul>
<figure class="fig"><img src="imagenes/u3_dispositivos_es.png" alt="Dispositivos de entrada (micrófono, webcam, mouse, escáner, teclado) y de salida (proyector, auriculares, monitor, impresora, altavoces)"><figcaption>Dispositivos de entrada y de salida.</figcaption></figure>
<h5>¿Cómo se conectan?</h5>
<p>Por puertos y conectores como USB, HDMI, audio, Ethernet o Bluetooth. Cada dispositivo tiene un controlador (un chip pequeño) que sirve de «traductor» entre el dispositivo y la computadora, porque cada uno habla a su manera.</p>
<h5>¿Cómo se comunica la CPU con ellos? Hay tres formas</h5>
<ol>
    <li><strong>E/S programada:</strong> la CPU está preguntando todo el tiempo «¿ya terminaste?». Gasta mucho tiempo.</li>
    <li><strong>Por interrupciones:</strong> el dispositivo le avisa a la CPU cuando ya terminó, y mientras tanto la CPU hace otras cosas.</li>
    <li><strong>DMA:</strong> el dispositivo pasa los datos directo a la memoria sin molestar a la CPU.</li>
</ol>

<!-- ===================== 3.2.2 ===================== -->
<h4 id="s-3-2-2">3.2.2 Almacenamiento</h4>
<p>El almacenamiento es el subsistema encargado de conservar instrucciones y datos. Se organiza en una jerarquía que equilibra costo, velocidad y capacidad a lo largo de los buses del sistema.</p>
<h5>¿Cómo se organiza la jerarquía?</h5>
<ol>
    <li><strong>Registros del procesador:</strong> almacenamiento ultra rápido integrado directamente en la CPU.</li>
    <li><strong>Memoria caché (L1, L2, L3):</strong> memoria SRAM integrada/cercana a la CPU que almacena datos de acceso frecuente para reducir la latencia del bus.</li>
    <li><strong>Memoria principal (RAM):</strong> memoria volátil de acceso aleatorio (DRAM) conectada mediante el bus de datos donde residen los programas en ejecución.</li>
    <li><strong>Almacenamiento secundario / masivo:</strong> dispositivos no volátiles (SSD NVMe/SATA, HDD) conectados mediante controladores de E/S.</li>
</ol>
<h5>Mecanismos arquitectónicos clave</h5>
<ul>
    <li><strong>Principio de localidad:</strong> espacial y temporal (base para que la caché funcione).</li>
    <li><strong>Mapeo de memoria / espacio de direcciones:</strong> la CPU usa el bus de direcciones para ubicar cada celda de almacenamiento.</li>
    <li><strong>Acceso Directo a Memoria (DMA):</strong> permite que el almacenamiento secundario transfiera bloques completos hacia la RAM sin intervenir la CPU.</li>
</ul>

<!-- ===================== 3.2.3 ===================== -->
<h4 id="s-3-2-3">3.2.3 Fuentes de alimentación</h4>
<p>Todos los electrodomésticos cotidianos, como televisores, computadoras o radios, cuentan con una fuente de alimentación que les permite obtener energía de la red eléctrica en los diferentes voltajes requeridos. Además, este componente proporciona cierto grado de protección frente a las eventuales fluctuaciones del suministro eléctrico, como la sobretensión.</p>
<p>Las fuentes de alimentación pueden ser de dos tipos: lineales o conmutativas.</p>
<div class="info-grid">
    <div class="info-card">
        <h5>Fuentes de alimentación lineales</h5>
        <p>Sus componentes están dispuestos de manera sucesiva, conforme al siguiente esquema:</p>
        <ul>
            <li>Transformador (reductor de tensión).</li>
            <li>Rectificador (conversión de voltaje alterno a onda completa).</li>
            <li>Filtro (conversión de onda completa a continua).</li>
            <li>Regulación (mantenimiento del voltaje de salida ante variaciones en la carga).</li>
        </ul>
        <p>Es un tipo de fuente menos eficiente, debido a que parte de la energía se convierte en calor durante la regulación. Sin embargo, posee un bajo costo y un diseño compacto.</p>
    </div>
    <div class="info-card">
        <h5>Fuentes de alimentación conmutativas</h5>
        <p>Operan a través de la transformación de la energía mediante transistores polarizados inversamente. Su esquema de componentes es:</p>
        <ul>
            <li>Rectificador.</li>
            <li>Conmutador.</li>
            <li>Transformador.</li>
            <li>Otro rectificador.</li>
            <li>Salida.</li>
        </ul>
        <p>Esto les permite operar de manera mucho más eficiente que las fuentes lineales, ya que tienen menor tamaño y menor calentamiento.</p>
    </div>
</div>
<figure class="fig fig-chica"><img src="imagenes/u3_fuente_alimentacion.png" alt="Ventilador de una fuente de alimentación de computadora"><figcaption>Fuente de alimentación de una computadora.</figcaption></figure>

<!-- ===================== 3.3 ===================== -->
<h3 id="s-3-3">3.3 Ambientes de servicio</h3>
<p>Estos hacen referencia a las infraestructuras y plataformas de cómputo (hardware, servidores, redes y almacenamiento) diseñadas para respaldar, ejecutar y mantener operativas las aplicaciones de software que prestan servicios a distintos sectores.</p>
<p>Se organizan y configuran los recursos informáticos para garantizar aspectos clave como:</p>
<ul>
    <li>Que el servicio esté activo cuando se necesite.</li>
    <li>Que el sistema pueda crecer si aumenta la cantidad de usuarios o datos.</li>
    <li>Que la información esté protegida y el sistema no se caiga ante un error.</li>
</ul>
<p><strong>Cada ambiente exige un diseño de hardware diferente:</strong> no se requiere la misma arquitectura para un punto de venta en un negocio local, que para un servidor industrial en una fábrica, o un centro de datos de comercio electrónico con millones de visitas simultáneas.</p>
<figure class="fig fig-chica"><img src="imagenes/u3_ambientes_servicio.png" alt="Persona programando en varias laptops y monitores"><figcaption>Ambientes de servicio: infraestructura que respalda las aplicaciones.</figcaption></figure>

<!-- ===================== 3.3.1 ===================== -->
<h4 id="s-3-3-1">3.3.1 Negocios</h4>
<h5>¿Qué es?</h5>
<p>Es cómo se usa la arquitectura de computadoras dentro de una empresa o negocio, o sea, qué equipos necesita para trabajar bien.</p>
<h5>¿Qué se usa en un negocio?</h5>
<ul>
    <li><strong>Computadoras de escritorio y laptops</strong> para el trabajo diario: facturar, hacer documentos, atender clientes.</li>
    <li><strong>Servidores</strong> para guardar la información de la empresa (clientes, ventas, inventario) y compartirla entre todos.</li>
    <li><strong>Redes</strong> (cableadas y WiFi) para que todo esté conectado.</li>
    <li><strong>Punto de venta (TPV):</strong> caja, lector de código de barras, impresora de tickets, terminal de tarjetas.</li>
    <li><strong>Sistemas de gestión</strong> como ERP o sistemas de inventario, para controlar productos, compras y ventas.</li>
    <li><strong>Respaldo de datos o nube</strong> para no perder información.</li>
</ul>
<h5>Ejemplo</h5>
<p>Una tienda tiene su caja con lector de códigos (E/S), una computadora que registra la venta, un servidor que actualiza el inventario y una red que conecta todo, así cuando vendes algo el inventario se descuenta solo.</p>

<!-- ===================== 3.3.2 ===================== -->
<h4 id="s-3-3-2">3.3.2 Industria</h4>
<p>Es el sector tecnológico y comercial dedicado al diseño, fabricación y comercialización de los componentes fundamentales del hardware (procesadores, memorias, chipsets y buses) que impulsan la computación moderna.</p>
<h5>¿Qué abarca?</h5>
<ul>
    <li><strong>Diseñadores fabless (sin fábrica):</strong> empresas que crean las arquitecturas e instrucciones (ej. Nvidia, AMD, Apple, Qualcomm) y licencian diseños (ej. ARM, RISC-V).</li>
    <li><strong>Fundidoras (foundries):</strong> fabricantes especializados en litografía de semiconductores en obleas de silicio (ej. TSMC, Samsung Foundry, Intel Foundry).</li>
    <li><strong>Empresas EDA e IP:</strong> proveedores de software de diseño de circuitos y bloques de propiedad intelectual (ej. Synopsys, Cadence).</li>
</ul>
<h5>Modelos arquitectónicos dominantes</h5>
<div class="info-grid">
    <div class="info-card"><h5>x86</h5><p>Dominante en computadoras de escritorio y servidores/data centers (Intel, AMD).</p></div>
    <div class="info-card"><h5>ARM</h5><p>Dominante en dispositivos móviles, eficiencia energética e infraestructura cloud moderna.</p></div>
    <div class="info-card"><h5>RISC-V</h5><p>Arquitectura de código abierto en rápido crecimiento para sistemas embebidos e IA.</p></div>
</div>
<h5>Tendencias e impacto económico</h5>
<ul>
    <li><strong>Aceleradores de IA:</strong> arquitecturas diseñadas específicamente para procesamiento matricial y paralelo (GPUs, TPUs, NPUs).</li>
    <li><strong>Geopolítica y cadena de suministro:</strong> industria crítica global concentrada en puntos clave de manufactura y empaquetado avanzado.</li>
</ul>

<!-- ===================== 3.3.3 ===================== -->
<h4 id="s-3-3-3">3.3.3 Comercio electrónico</h4>
<p>El comercio electrónico es el proceso de compraventa de bienes y servicios a través de Internet. Implica el intercambio de productos o servicios entre empresas, consumidores o ambos.</p>
<p>Hoy en día, el comercio electrónico puede referirse al comercio entre empresas o a transacciones comerciales internas. También puede aplicarse a, por ejemplo:</p>
<ul>
    <li>Las tiendas online de los minoristas multicanal con ubicaciones físicas.</li>
    <li>Plataformas de economía colaborativa que facilitan la compra de servicios como viajes compartidos.</li>
    <li>Sitios de redes sociales como Facebook, donde los consumidores interactúan con el llamado comercio social.</li>
    <li>Organizaciones que venden productos digitales para uso empresarial.</li>
</ul>
